// ---------- Utilities: RNG, math, colors ----------
'use strict';
const W = 480, H = 270;

// Mulberry32 seeded RNG
function makeRng(seed) {
  let s = seed >>> 0;
  const r = function () {
    s |= 0; s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  r.int = (a, b) => a + Math.floor(r() * (b - a + 1));
  r.pick = (arr) => arr[Math.floor(r() * arr.length)];
  r.chance = (p) => r() < p;
  r.shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  r.range = (a, b) => a + r() * (b - a);
  return r;
}
const RNG = makeRng((Date.now() ^ 0x9E3779B9) >>> 0);

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = (t) => 1 - (1 - t) * (1 - t);
const easeIn = (t) => t * t;
const fmtMoney = (n) => '

function hexToRgb(hex) {
  const h = hex.replace('#', '');
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function rgbToHex(r, g, b) {
  const c = (v) => ('0' + clamp(Math.round(v), 0, 255).toString(16)).slice(-2);
  return '#' + c(r) + c(g) + c(b);
}
function shade(hex, amt) {
  const [r, g, b] = hexToRgb(hex);
  return rgbToHex(r + amt, g + amt, b + amt);
}
function mixColor(a, b, t) {
  const A = hexToRgb(a), B = hexToRgb(b);
  return rgbToHex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t));
}

// Draw helpers
function rect(ctx, x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function frame(ctx, x, y, w, h, color) {
  rect(ctx, x, y, w, 1, color); rect(ctx, x, y + h - 1, w, 1, color);
  rect(ctx, x, y, 1, h, color); rect(ctx, x + w - 1, y, 1, h, color);
}
function panel(ctx, x, y, w, h, opts = {}) {
  const bg = opts.bg || '#1a1728', border = opts.border || '#6b5f9a', inner = opts.inner || '#2a2540';
  rect(ctx, x, y, w, h, border);
  rect(ctx, x + 1, y + 1, w - 2, h - 2, bg);
  frame(ctx, x + 2, y + 2, w - 4, h - 4, inner);
}
function dashedLine(ctx, x1, y1, x2, y2, color, dash = 3, gap = 3, offset = 0) {
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);
  if (len < 0.01) return;
  const ux = dx / len, uy = dy / len;
  ctx.fillStyle = color;
  for (let d = offset % (dash + gap) - (dash + gap); d < len; d += dash + gap) {
    for (let k = Math.max(0, d); k < Math.min(len, d + dash); k += 1) {
      ctx.fillRect(Math.round(x1 + ux * k), Math.round(y1 + uy * k), 1, 1);
    }
  }
}
function circle(ctx, cx, cy, r, color) {
  ctx.fillStyle = color;
  for (let y = -r; y <= r; y++) {
    const w = Math.floor(Math.sqrt(r * r - y * y));
    ctx.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2 + 1, 1);
  }
}
function ringPx(ctx, cx, cy, r, color) {
  ctx.fillStyle = color;
  const steps = Math.max(12, Math.floor(r * 6));
  for (let i = 0; i < steps; i++) {
    const a = (i / steps) * Math.PI * 2;
    ctx.fillRect(Math.round(cx + Math.cos(a) * r), Math.round(cy + Math.sin(a) * r), 1, 1);
  }
}

// ---------- Touch controls: on-screen buttons and rhythm pads ----------
'use strict';

// A tappable on-screen button drawn on the canvas.
class Btn {
  constructor(x, y, w, h, label, onTap, opts = {}) {
    Object.assign(this, { x, y, w, h, label, onTap, opts, held: false, flash: 0 });
  }
  hit(px, py) { return px >= this.x && px < this.x + this.w && py >= this.y && py < this.y + this.h; }
  draw(ctx) {
    const o = this.opts;
    const bg = this.held ? (o.activeBg || '#5a54a0') : (o.bg || '#2a2540');
    const border = o.border || '#8a80c0';
    rect(ctx, this.x, this.y, this.w, this.h, bg);
    frame(ctx, this.x, this.y, this.w, this.h, border);
    if (this.flash > 0) { ctx.globalAlpha = this.flash * 2; rect(ctx, this.x + 1, this.y + 1, this.w - 2, this.h - 2, o.activeBg || '#fff'); ctx.globalAlpha = 1; }
    const scale = o.scale || 1;
    drawText(ctx, this.label, this.x + this.w / 2, this.y + Math.floor((this.h - 5 * scale) / 2), o.color || '#fff', { align: 'center', scale });
    if (o.sub) drawText(ctx, o.sub, this.x + this.w / 2, this.y + this.h - 7, o.subColor || '#cfc9e6', { align: 'center' });
  }
  update(dt) { this.flash = Math.max(0, this.flash - dt * 4); }
}

// Builds the row of rhythm pads for the instrument currently being played.
// Returns [{x, y, w, h, code, label, sub, color}]
function buildPads(instr, area) {
  const pads = [];
  const { x, y, w, h } = area;
  const add = (fx, fw, code, label, color, sub) => pads.push({ x: Math.round(x + w * fx), y, w: Math.round(w * fw) - 2, h, code, label, color, sub });
  switch (instr.game) {
    case 'lanes': {
      const L = instr.lanes;
      for (let i = 0; i < L; i++) add(i / L, 1 / L, instr.keys[i], instr.keyNames[i], LANE_COLORS[i]);
      break;
    }
    case 'taiko':
      add(0, 0.22, 'KeyD', 'KA', '#5bc0ff');
      add(0.22, 0.28, 'KeyF', 'DON', '#ff6b6b');
      add(0.50, 0.28, 'KeyJ', 'DON', '#ff6b6b');
      add(0.78, 0.22, 'KeyK', 'KA', '#5bc0ff');
      break;
    case 'wind':
      add(0.1, 0.8, 'Space', 'BLOW', '#e0b040', 'HOLD THE PAD');
      break;
    case 'valves':
      add(0.14, 0.24, 'KeyJ', '1', '#f0c040');
      add(0.38, 0.24, 'KeyK', '2', '#f0c040');
      add(0.62, 0.24, 'KeyL', '3', '#f0c040');
      break;
    case 'bow':
      add(0.04, 0.46, 'ArrowUp', '↑ UP BOW', '#c58bff');
      add(0.50, 0.46, 'ArrowDown', '↓ DOWN BOW', '#6be585');
      break;
  }
  return pads;
}

function drawPads(ctx, pads, downCodes, t) {
  for (const p of pads) {
    const on = downCodes.has(p.code);
    rect(ctx, p.x, p.y, p.w, p.h, on ? p.color : '#181430');
    frame(ctx, p.x, p.y, p.w, p.h, on ? '#fff' : shade(p.color, -40));
    rect(ctx, p.x + 1, p.y + 1, p.w - 2, 1, on ? '#fff' : shade(p.color, -70));
    const col = on ? '#141026' : p.color;
    const big = p.label.length <= 3;
    drawText(ctx, p.label, p.x + p.w / 2, p.y + (p.sub ? 10 : Math.floor((p.h - (big ? 10 : 5)) / 2)), col, { align: 'center', scale: big ? 2 : 1 });
    if (p.sub) drawText(ctx, p.sub, p.x + p.w / 2, p.y + p.h - 9, on ? '#141026' : '#8a80c0', { align: 'center' });
  }
}

const _fontCache = new Map();
function _glyphCanvas(ch, color, scale) {
  const key = ch + '|' + color + '|' + scale;
  let c = _fontCache.get(key);
  if (c) return c;
  const g = FONT[ch] || FONT['?'];
  c = document.createElement('canvas');
  c.width = 3 * scale; c.height = 5 * scale;
  const cx = c.getContext('2d');
  cx.fillStyle = color;
  for (let y = 0; y < 5; y++) for (let x = 0; x < 3; x++) if (g[y][x]) cx.fillRect(x * scale, y * scale, scale, scale);
  _fontCache.set(key, c);
  return c;
}
function textWidth(str, scale = 1) {
  return str.length * 4 * scale - scale;
}
// opts: {scale, align:'left'|'center'|'right', shadow, color}
function drawText(ctx, str, x, y, color = '#ffffff', opts = {}) {
  const scale = opts.scale || 1;
  str = String(str);
  let cx = Math.round(x);
  const w = textWidth(str, scale);
  if (opts.align === 'center') cx -= Math.floor(w / 2);
  else if (opts.align === 'right') cx -= w;
  const yy = Math.round(y);
  if (opts.shadow) {
    let sx = cx;
    for (const raw of str) {
      const ch = raw.length === 1 && raw >= 'a' && raw <= 'z' ? raw.toUpperCase() : raw;
      if (ch !== ' ') ctx.drawImage(_glyphCanvas(ch, opts.shadow, scale), sx + scale, yy + scale);
      sx += 4 * scale;
    }
  }
  for (const raw of str) {
    const ch = raw.length === 1 && raw >= 'a' && raw <= 'z' ? raw.toUpperCase() : raw;
    if (ch !== ' ') ctx.drawImage(_glyphCanvas(ch, color, scale), cx, yy);
    cx += 4 * scale;
  }
  return w;
}
// Word-wrap text into lines of at most maxChars
function wrapText(str, maxChars) {
  const words = String(str).split(' ');
  const lines = [];
  let cur = '';
  for (const w of words) {
    if ((cur + ' ' + w).trim().length > maxChars && cur) { lines.push(cur); cur = w; }
    else cur = (cur ? cur + ' ' : '') + w;
  }
  if (cur) lines.push(cur);
  return lines;
}
function drawWrapped(ctx, str, x, y, maxChars, color, lineH = 7, opts = {}) {
  const lines = wrapText(str, maxChars);
  lines.forEach((l, i) => drawText(ctx, l, x, y + i * lineH, color, opts));
  return lines.length;
}

// ---------- Pixel art sprites ----------
'use strict';
const _spriteCache = new Map();

// rows: array of strings; palette: char -> color. '.' = transparent
function makeSprite(rows, palette, key) {
  if (key && _spriteCache.has(key)) return _spriteCache.get(key);
  const h = rows.length, w = rows[0].length;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = rows[y][x];
    if (ch === '.' || ch === ' ') continue;
    const col = palette[ch];
    if (!col) continue;
    ctx.fillStyle = col; ctx.fillRect(x, y, 1, 1);
  }
  if (key) _spriteCache.set(key, c);
  return c;
}
function flipSprite(c, key) {
  if (key && _spriteCache.has(key)) return _spriteCache.get(key);
  const f = document.createElement('canvas');
  f.width = c.width; f.height = c.height;
  const ctx = f.getContext('2d');
  ctx.translate(c.width, 0); ctx.scale(-1, 1); ctx.drawImage(c, 0, 0);
  if (key) _spriteCache.set(key, f);
  return f;
}

function bugPalette(sp, override = {}) {
  const b = override.b || sp.b, s = override.s || sp.s;
  return {
    o: override.o || '#14101c', b, s, e: '#14101c', h: '#ffffff', a: override.a || sp.a, m: shade(b, -40),
    w: override.w || '#dfe9ff', v: override.v || '#ff7fbf',
  };
}
function bugSprite(speciesKey, pose = 'stand', override = {}) {
  const key = 'bug|' + speciesKey + '|' + pose + '|' + JSON.stringify(override);
  if (_spriteCache.has(key)) return _spriteCache.get(key);
  const sp = SPECIES[speciesKey] || SPECIES.beetle;
  const pal = bugPalette(sp, override);
  const c = document.createElement('canvas');
  c.width = 16; c.height = 18;
  const ctx = c.getContext('2d');
  // wings behind
  if (sp.wings) {
    const wpal = { w: pal.w, v: pal.v };
    const ws = makeSprite(WINGS[sp.wings], wpal);
    ctx.globalAlpha = 0.85;
    ctx.drawImage(ws, 2, 8);
    ctx.globalAlpha = 1;
  }
  const body = makeSprite(BUG_BASE[pose] || BUG_BASE.stand, pal);
  ctx.drawImage(body, 2, 2);
  // decor
  ctx.fillStyle = '#14101c';
  if (sp.decor === 'spots') {
    [[6, 10], [9, 10], [7, 12], [10, 12], [5, 12]].forEach(([x, y]) => ctx.fillRect(x, y, 1, 1));
  } else if (sp.decor === 'stripes') {
    ctx.fillStyle = '#2a2a2a';

  } else if (sp.decor === 'horn') {
    ctx.fillStyle = pal.o; ctx.fillRect(7, 2, 2, 2); ctx.fillStyle = shade(pal.b, 30); ctx.fillRect(7, 3, 2, 1);
  } else if (sp.decor === 'glow') {
    ctx.fillStyle = '#ffe66d'; ctx.fillRect(6, 12, 4, 1); ctx.fillStyle = '#fff6b0'; ctx.fillRect(7, 12, 2, 1);
  } else if (sp.decor === 'shell') {

    ctx.fillStyle = '#b06a3a'; ctx.fillRect(11, 9, 3, 3);
    ctx.fillStyle = '#e0a070'; ctx.fillRect(12, 10, 1, 1); ctx.fillRect(11, 9, 1, 1);

    ctx.fillRect(1, 9, 1, 1); ctx.fillRect(14, 9, 1, 1);

}

// Draw a bug character with optional instrument
// opts: {pose, override, flip, hat, instrument, scale}
function drawBug(ctx, speciesKey, x, y, opts = {}) {
  const pose = opts.pose || 'stand';
  let spr = bugSprite(speciesKey, pose, opts.override || {});
  if (opts.flip) spr = flipSprite(spr, 'bugflip|' + speciesKey + '|' + pose + '|' + JSON.stringify(opts.override || {}));
  const sc = opts.scale || 1;
  ctx.drawImage(spr, Math.round(x), Math.round(y), 16 * sc, 18 * sc);
  if (opts.hat && HATS[opts.hat]) {
    const h = HATS[opts.hat];
    const hs = makeSprite(h.rows, h.pal, 'hat|' + opts.hat);
    ctx.drawImage(hs, Math.round(x + 4 * sc), Math.round(y + (4 - h.rows.length) * sc), hs.width * sc, hs.height * sc);
  }
  if (opts.instrument) {
    const is = instrumentSprite(opts.instrument);
    let ox = 2, oy = 9;
    if (opts.instrument === 'drums') { ox = 0; oy = 8; }
    if (opts.instrument === 'piano') { ox = -1; oy = 10; }
    if (opts.instrument === 'sax') { ox = 8; oy = 6; }
    if (opts.instrument === 'trumpet') { ox = 6; oy = 6; }
    if (opts.instrument === 'violin') { ox = 4; oy = 4; }
    if (opts.instrument === 'tambourine') { ox = 10; oy = 8; }
    ctx.drawImage(is, Math.round(x + ox * sc), Math.round(y + oy * sc), is.width * sc, is.height * sc);
  }
}

// ---------- Procedural WebAudio synth ----------
'use strict';
const Audio = {
  ctx: null, master: null, noiseBuf: null, muted: false, volume: 0.6,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.volume;
    const comp = this.ctx.createDynamicsCompressor();
    comp.threshold.value = -12; comp.ratio.value = 4;
    this.master.connect(comp); comp.connect(this.ctx.destination);
    const len = this.ctx.sampleRate * 1;
    this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  },
  now() { return this.ctx ? this.ctx.currentTime : performance.now() / 1000; },
  setMuted(m) { this.muted = m; if (this.master) this.master.gain.value = m ? 0 : this.volume; },
  freq(midi) { return 440 * Math.pow(2, (midi - 69) / 12); },
  _env(g, t, a, peak, d, sus, holdTo, r) {
    // ADSR on gain node g (holdTo = absolute time note releases)
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0001, peak * sus), t + a + d);
    if (holdTo != null) {
      g.gain.setValueAtTime(Math.max(0.0001, peak * sus), Math.max(holdTo, t + a + d));
      g.gain.exponentialRampToValueAtTime(0.0001, Math.max(holdTo, t + a + d) + r);
    }
  },
  _noise(t, dur, filterType, freq, q, vel) {
    const c = this.ctx;
    const src = c.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
    const f = c.createBiquadFilter(); f.type = filterType; f.frequency.value = freq; f.Q.value = q || 1;
    const g = c.createGain();
    g.gain.setValueAtTime(vel, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + dur + 0.05);
  },
  // Play a pitched instrument note. dur in seconds (sustain length). Returns handle {off(when)}
  note(instr, midi, when, dur = 0.4, vel = 0.5) {
    if (!this.ctx || this.muted) return { off() {} };
    const c = this.ctx, t = Math.max(when || c.currentTime, c.currentTime);
    const f0 = this.freq(midi);
    const out = c.createGain(); out.connect(this.master);
    const oscs = [];
    let filt = c.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 4000; filt.connect(out);
    const mk = (type, f, det = 0, g = 1) => {
      const o = c.createOscillator(); o.type = type; o.frequency.value = f; o.detune.value = det;
      const og = c.createGain(); og.gain.value = g; o.connect(og); og.connect(filt); oscs.push(o); return o;
    };
    let endAt = t + dur + 0.3, release = 0.1;
    const vib = (o, rate, depth) => {
      const l = c.createOscillator(); l.frequency.value = rate; const lg = c.createGain(); lg.gain.value = depth;
      l.connect(lg); lg.connect(o.detune); oscs.push(l);
    };
    switch (instr) {
      case 'guitar':
        mk('triangle', f0, 0, 0.6); mk('sawtooth', f0, 6, 0.35); mk('sine', f0 * 2, 0, 0.15);
        filt.frequency.setValueAtTime(3500, t); filt.frequency.exponentialRampToValueAtTime(700, t + 0.5);
        this._env(out, t, 0.004, vel, 0.5, 0.15, t + Math.min(dur, 1.2), 0.15); endAt = t + Math.min(dur, 1.2) + 0.3; break;
      case 'bass':
        mk('sine', f0, 0, 0.8); mk('square', f0, 0, 0.25); mk('sawtooth', f0 * 2, 0, 0.08);
        filt.frequency.setValueAtTime(900, t); filt.frequency.exponentialRampToValueAtTime(250, t + 0.3);
        this._env(out, t, 0.006, vel * 1.1, 0.25, 0.4, t + dur, 0.12); endAt = t + dur + 0.3; break;
      case 'piano':
        mk('sine', f0, 0, 0.7); mk('triangle', f0 * 2, 0, 0.25); mk('sine', f0 * 3, 0, 0.08); mk('sine', f0 * 4.01, 0, 0.04);
        filt.frequency.setValueAtTime(5000, t); filt.frequency.exponentialRampToValueAtTime(1200, t + 0.8);
        this._env(out, t, 0.003, vel, 0.6, 0.12, t + Math.min(dur, 1.5), 0.2); endAt = t + Math.min(dur, 1.5) + 0.4; break;
      case 'sax': {
        const o = mk('sawtooth', f0, 0, 0.5); mk('square', f0, -5, 0.2); mk('sine', f0 * 2, 0, 0.1);
        vib(o, 5.5, 10);
        filt.frequency.setValueAtTime(600, t); filt.frequency.linearRampToValueAtTime(2200, t + 0.08); filt.Q.value = 3;
        this._env(out, t, 0.05, vel * 0.8, 0.1, 0.8, t + dur, 0.12); release = 0.12; endAt = t + dur + 0.3; break; }
      case 'trumpet': {
        const o = mk('square', f0, 0, 0.35); mk('sawtooth', f0, 4, 0.4); mk('sine', f0 * 3, 0, 0.05);
        vib(o, 6, 6);
        filt.frequency.setValueAtTime(1200, t); filt.frequency.linearRampToValueAtTime(3800, t + 0.05); filt.Q.value = 2;
        this._env(out, t, 0.03, vel * 0.75, 0.08, 0.85, t + dur, 0.08); release = 0.08; endAt = t + dur + 0.3; break; }
      case 'violin': {
        const o = mk('sawtooth', f0, 0, 0.5); mk('sawtooth', f0, 8, 0.3); mk('triangle', f0 * 2, 0, 0.12);
        vib(o, 5.2, 14);
        filt.frequency.value = 3200; filt.Q.value = 1.5;
        this._env(out, t, 0.09, vel * 0.7, 0.1, 0.9, t + dur, 0.15); release = 0.15; endAt = t + dur + 0.4; break; }
      case 'tambourine':
        this._noise(t, 0.15, 'highpass', 5000, 1, vel * 0.7);
        mk('sine', 3200, 0, 0.15); mk('sine', 4700, 0, 0.1);
        this._env(out, t, 0.002, vel * 0.5, 0.12, 0.01, t + 0.1, 0.05); endAt = t + 0.3; break;
      case 'pad':
        mk('triangle', f0, 0, 0.5); mk('triangle', f0, 7, 0.4); mk('sine', f0 / 2, 0, 0.2);
        filt.frequency.value = 1400;
        this._env(out, t, 0.15, vel * 0.5, 0.2, 0.8, t + dur, 0.3); endAt = t + dur + 0.6; break;
      default:
        mk('triangle', f0, 0, 0.7); this._env(out, t, 0.01, vel, 0.3, 0.3, t + dur, 0.1); endAt = t + dur + 0.3;
    }
    oscs.forEach(o => { o.start(t); o.stop(endAt + 0.1); });
    return {
      off: (when) => {
        const tt = Math.max(when || c.currentTime, c.currentTime);
        out.gain.cancelScheduledValues(tt);
        out.gain.setValueAtTime(Math.max(0.0001, out.gain.value), tt);
        out.gain.exponentialRampToValueAtTime(0.0001, tt + release);
        oscs.forEach(o => { try { o.stop(tt + release + 0.05); } catch (e) { } });
      }
    };
  },
  drum(kind, when, vel = 0.6) {
    if (!this.ctx || this.muted) return;
    const c = this.ctx, t = Math.max(when || c.currentTime, c.currentTime);
    const tone = (f1, f2, dur, type, v) => {
      const o = c.createOscillator(); o.type = type || 'sine';
      o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
      const g = c.createGain(); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.05);
    };
    switch (kind) {
      case 'kick': tone(150, 45, 0.18, 'sine', vel); break;
      case 'snare': tone(220, 120, 0.12, 'triangle', vel * 0.5); this._noise(t, 0.16, 'highpass', 1500, 1, vel * 0.6); break;
      case 'hat': this._noise(t, 0.05, 'highpass', 8000, 1, vel * 0.35); break;
      case 'ohat': this._noise(t, 0.18, 'highpass', 7000, 1, vel * 0.3); break;
      case 'don': tone(190, 70, 0.22, 'sine', vel * 1.1); this._noise(t, 0.08, 'lowpass', 500, 1, vel * 0.4); break;
      case 'ka': tone(900, 500, 0.06, 'square', vel * 0.25); this._noise(t, 0.09, 'highpass', 3000, 2, vel * 0.7); break;
      case 'crash': this._noise(t, 0.9, 'highpass', 4000, 0.5, vel * 0.5); break;
      case 'tom': tone(260, 120, 0.2, 'sine', vel * 0.8); break;
      case 'clunk': tone(120, 60, 0.1, 'sawtooth', vel * 0.3); this._noise(t, 0.06, 'lowpass', 700, 1, vel * 0.4); break;
    }
  },
  ui(kind) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const beep = (f1, f2, dur, type, v, dt = 0) => {
      const o = this.ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f1, t + dt);
      o.frequency.exponentialRampToValueAtTime(f2, t + dt + dur);
      const g = this.ctx.createGain(); g.gain.setValueAtTime(v, t + dt); g.gain.exponentialRampToValueAtTime(0.0001, t + dt + dur);
      o.connect(g); g.connect(this.master); o.start(t + dt); o.stop(t + dt + dur + 0.02);
    };
    switch (kind) {
      case 'move': beep(700, 900, 0.05, 'square', 0.12); break;
      case 'select': beep(600, 1200, 0.08, 'square', 0.15); beep(900, 1600, 0.1, 'square', 0.12, 0.06); break;
      case 'back': beep(500, 300, 0.1, 'square', 0.12); break;
      case 'coin': beep(1400, 2100, 0.07, 'sine', 0.2); beep(2100, 2600, 0.12, 'sine', 0.15, 0.06); break;
      case 'bill': beep(900, 1800, 0.1, 'triangle', 0.2); beep(1800, 2400, 0.15, 'triangle', 0.15, 0.08); break;
      case 'cash': beep(1200, 1600, 0.08, 'sine', 0.2); beep(1600, 2400, 0.15, 'sine', 0.2, 0.08); beep(2400, 3000, 0.2, 'sine', 0.15, 0.16); break;
      case 'error': beep(200, 120, 0.2, 'sawtooth', 0.15); break;
      case 'eat': beep(300, 500, 0.08, 'triangle', 0.15); beep(350, 550, 0.08, 'triangle', 0.15, 0.12); beep(400, 700, 0.12, 'triangle', 0.15, 0.24); break;
      case 'levelup': [0, 4, 7, 12].forEach((n, i) => beep(this.freq(72 + n), this.freq(72 + n), 0.15, 'square', 0.12, i * 0.08)); break;
      case 'fanfare': [0, 4, 7, 12, 7, 12].forEach((n, i) => beep(this.freq(67 + n), this.freq(67 + n), 0.2, 'square', 0.12, i * 0.1)); break;
      case 'sad': [7, 5, 3, 0].forEach((n, i) => beep(this.freq(60 + n), this.freq(60 + n) * 0.98, 0.3, 'triangle', 0.15, i * 0.25)); break;
      case 'hurt': beep(400, 100, 0.25, 'sawtooth', 0.2); break;
    }
  },
  applause(intensity = 0.5, dur = 1.2) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const n = Math.floor(6 + intensity * 14);
    for (let i = 0; i < n; i++) {
      const dt = Math.random() * dur;
      this._noise(t + dt, 0.04 + Math.random() * 0.03, 'bandpass', 1200 + Math.random() * 1500, 2, 0.08 + intensity * 0.12);
    }
  },
};

// ===== js/music.js =====
// ---------- Procedural songs, charts, and backing band ----------
'use strict';
const PROGRESSIONS = [[0, 4, 5, 3], [0, 5, 3, 4], [5, 3, 0, 4], [0, 3, 4, 4], [0, 0, 3, 4], [2, 5, 0, 4], [0, 4, 3, 4], [3, 4, 0, 0]];
const MAJOR = [0, 2, 4, 5, 7, 9, 11];
const SONG_ADJ = ['Foggy', 'Midnight', 'Sourdough', 'Cable Car', 'Bay', 'Sunset', 'Twin Peaks', 'Steep Hill', 'Sea Lion', 'Karl\'s', 'Painted Lady', 'Hyde Street'];
const SONG_NOUN = ['Shuffle', 'Blues', 'Stomp', 'Rag', 'Waltz', 'Bounce', 'Groove', 'Serenade', 'Rumble', 'Strut', 'Boogie', 'Lullaby'];

function chordTones(root, degree) {
  // triad on scale degree (major scale)
  const d = (i) => MAJOR[(degree + i) % 7] + 12 * Math.floor((degree + i) / 7);
  return [root + d(0), root + d(2), root + d(4)];
}
function scaleNote(root, idx) { return root + MAJOR[((idx % 7) + 7) % 7] + 12 * Math.floor(idx / 7); }

function makeSong(rng, bpm, bars) {
  const root = rng.int(55, 64);
  const prog = rng.pick(PROGRESSIONS);
  const chords = [];
  for (let b = 0; b < bars; b++) chords.push(prog[b % prog.length]);
  return {
    name: rng.pick(SONG_ADJ) + ' ' + rng.pick(SONG_NOUN),
    bpm, beat: 60 / bpm, bars, root, chords, prog,
    leadIn: 4 * (60 / bpm), // one bar count-in
    length: 4 * (60 / bpm) + bars * 4 * (60 / bpm) + 1.5,
  };
}

// Generate a melody-ish midi for a beat position (subdivision grid), following chord tones
function melodyPitch(song, bar, beatInBar, rng, prev) {
  const root = song.root + 12;
  const tones = chordTones(root, song.chords[bar]);
  if (beatInBar % 1 === 0 || rng.chance(0.6)) {
    let cand = tones.slice();
    if (rng.chance(0.3)) cand = cand.map(n => n + 12);
    if (prev != null) cand.sort((a, b) => Math.abs(a - prev) - Math.abs(b - prev));
    return rng.chance(0.65) ? cand[0] : rng.pick(cand);
  }
  // passing tone near previous
  const base = prev == null ? tones[0] : prev;
  const idx = Math.round((base - root) / 12 * 7);
  return scaleNote(root, idx + (rng.chance(0.5) ? 1 : -1));
}

// Chart generation. Returns notes: {t, lane, dur, type, midi, combo, dir}
// difficulty 1..6, sections: array of {instrument, startBar, endBar}
function generateChart(song, sections, difficulty, rng) {
  const notes = [];
  const beat = song.beat;
  const dens = clamp(0.35 + difficulty * 0.09, 0.4, 0.95); // on-beat density
  const offDens = clamp(-0.1 + difficulty * 0.14, 0, 0.75);
  const sixteenth = difficulty >= 4 ? (difficulty - 3) * 0.12 : 0;
  for (const sec of sections) {
    const instr = INSTRUMENTS[sec.instrument];
    let prev = null, lane = Math.floor((instr.lanes || 2) / 2), lastDir = 1;
    for (let bar = sec.startBar; bar < sec.endBar; bar++) {
      const barT = song.leadIn + bar * 4 * beat;
      const grid = []; // eighth-note grid, 8 per bar
      for (let e = 0; e < 8; e++) {
        const onBeat = e % 2 === 0;
        let p = onBeat ? dens : offDens;
        if (e === 0) p = Math.max(p, 0.8);
        grid.push(rng.chance(p));
      }
      // ensure at least 2 notes per bar
      if (grid.filter(Boolean).length < 2) { grid[0] = true; grid[4] = true; }
      const bi = bar - sec.startBar;
      const isLastBar = bar === sec.endBar - 1;
      for (let e = 0; e < 8; e++) {
        if (!grid[e]) continue;
        const t = barT + e * beat / 2;
        const midi = melodyPitch(song, bar, e / 2, rng, prev); prev = midi;
        let dur = 0;
        const nextOn = grid.slice(e + 1).findIndex(Boolean);
        const gapEighths = nextOn === -1 ? 8 - e : nextOn + 1;
        switch (instr.game) {
          case 'lanes': {
            const L = instr.lanes;
            if (L === 1) lane = 0;
            else { lane = clamp(lane + rng.int(-1, 1) * (rng.chance(0.7) ? 1 : 2), 0, L - 1); }
            if (gapEighths >= 3 && rng.chance(0.3 + difficulty * 0.05)) dur = (gapEighths - 1) * beat / 2;
            notes.push({ t, lane, dur, type: dur ? 'hold' : 'tap', midi });
            if (L >= 6 && difficulty >= 3 && !dur && rng.chance(0.18)) {
              const l2 = lane + (lane < L - 2 ? 2 : -2);
              notes.push({ t, lane: l2, dur: 0, type: 'tap', midi: midi + 4 });
            }
            break;
          }
          case 'taiko': {
            const onBeat = e % 2 === 0;
            let type = onBeat ? (rng.chance(0.75) ? 'don' : 'ka') : (rng.chance(0.6) ? 'ka' : 'don');
            if (e === 0 && bi % 2 === 1 && rng.chance(0.35 + difficulty * 0.05)) type = 'big';
            if (isLastBar && e === 4 && rng.chance(0.5)) { notes.push({ t, lane: 0, dur: beat * 1.5, type: 'roll', midi }); break; }
            notes.push({ t, lane: 0, dur: 0, type, midi });
            break;
          }
          case 'wind': {
            // phrases: holds with breaths
            if (gapEighths >= 2) dur = Math.max(beat * 0.5, (gapEighths - 0.5) * beat / 2);
            else dur = beat * 0.4;
            const pitch = clamp((midi - song.root - 12) / 19, 0, 1);
            notes.push({ t, lane: 0, dur, type: 'hold', midi, pitch });
            break;
          }
          case 'valves': {
            const combo = 1 + ((midi - song.root) % 7 + 7) % 7; // 1..7 bitmask
            notes.push({ t, lane: 0, dur: 0, type: 'tap', midi, combo });
            break;
          }
          case 'bow': {

}

// Backing band: schedules drums/bass/pads ahead of time
class Backing {
  constructor(song, startTime, mute) {
    this.song = song; this.start = startTime; this.mute = mute || {};
    this.nextStep = 0; // 16th-note steps since leadIn start
    this.stepDur = song.beat / 4;
    this.totalSteps = (song.bars + 4) * 16;
    this.stopped = false;
  }
  update() {
    if (this.stopped || !Audio.ctx) return;
    const now = Audio.now();
    const horizon = now + 0.3;
    while (this.nextStep < this.totalSteps) {
      const t = this.start + this.nextStep * this.stepDur;
      if (t > horizon) break;
      this.schedule(this.nextStep, t);
      this.nextStep++;
    }
  }
  schedule(step, t) {
    const s = this.song;
    const barIdx = Math.floor(step / 16); // bar 0 = count-in
    const inBar = step % 16;
    const beatIdx = Math.floor(inBar / 4), sub = inBar % 4;
    const countIn = barIdx === 0;
    const outro = barIdx > s.bars;
    const mute = typeof this.mute === 'function' ? (this.mute(t) || {}) : this.mute;
    if (countIn) { if (sub === 0) Audio.drum('hat', t, 0.7); return; }
    const chord = s.chords[Math.min(barIdx - 1, s.bars - 1)];
    const rootMidi = s.root - 12;
    if (!mute.drums && !outro) {
      if (sub === 0 && (beatIdx === 0 || beatIdx === 2)) Audio.drum('kick', t, 0.6);
      if (sub === 0 && (beatIdx === 1 || beatIdx === 3)) Audio.drum('snare', t, 0.45);
      if (sub === 2) Audio.drum('hat', t, 0.35);
      if (sub === 0) Audio.drum('hat', t, 0.2);
    }
    if (outro && step === (s.bars + 1) * 16) Audio.drum('crash', t, 0.5);
    if (!mute.bass && !outro) {
      const tones = chordTones(rootMidi, chord);
      if (sub === 0 && beatIdx === 0) Audio.note('bass', tones[0], t, s.beat * 0.9, 0.35);
      if (sub === 0 && beatIdx === 2) Audio.note('bass', tones[0], t, s.beat * 0.9, 0.3);
      if (sub === 2 && beatIdx === 1) Audio.note('bass', tones[2] - 12 + 12, t, s.beat * 0.4, 0.22);
      if (sub === 2 && beatIdx === 3) Audio.note('bass', tones[1], t, s.beat * 0.4, 0.22);
    }
    if (!mute.pad && !outro && inBar === 0) {
      const tones = chordTones(s.root, chord);
      tones.forEach(m => Audio.note('pad', m, t, s.beat * 3.8, 0.16));
    }
  }
  stop() { this.stopped = true; }
}

// ===== js/rhythm.js =====
// ---------- Rhythm engine + instrument minigames ----------
'use strict';
const JUDGE = { perfect: 0.045, great: 0.09, good: 0.14, window: 0.19 };

    this.song = song; this.sections = sections; this.notes = notes; this.mods = mods;

    this.events = { perfects: 0, misses: 0, cheer: 0 };

    this.voices = {};

  }
  get section() { return this.sections[this.secIdx]; }
  get instrument() { return INSTRUMENTS[this.section.instrument]; }

  begin(audioTime) { this.startTime = audioTime; }
  win(kind) {
    let m = this.mods.windowMult || 1;

  judgeDt(dt) {

  applyJudge(j, note, opts = {}) {

    if (j !== 'miss') gain *= this.hypeScale;

    }
    this.hype = clamp(this.hype + gain, 0, 100);

      if (!pred(n)) continue;

  }
  playHit(note, j, hold) {

  }
  keyUp(code) {

  // ---------- Rendering ----------
  draw(ctx, A) {

      drawText(ctx, 'NOW: ' + this.instrument.name.toUpperCase() + ' (' + this.instrument.keyNames.join(' ') + ')', A.x + A.w / 2, A.y + A.h / 2 - 5, '#ffe14d', { align: 'center', scale: 2 });

      drawText(ctx, 'SWITCH: ' + ni.name.toUpperCase(), A.x + A.w - 66, A.y + 4, blink ? '#ff9f68' : '#fff', { align: 'center' });
      drawText(ctx, ni.keyNames.join(' ') + (ns.member ? ' - ' + ns.member.name : ''), A.x + A.w - 66, A.y + 11, '#ccc', { align: 'center' });
    }
    if (this.mods.metronome) {
      const r = 2 + Math.round(this.beatPulse * 3);

  }
  drawLanes(ctx, A) {
    const instr = this.instrument; const L = instr.lanes;
    const padCols = A.touch && A.pads && A.pads.length === L ? A.pads : null;
    const laneW = padCols ? padCols[0].w + 2 : Math.min(40, Math.floor((A.w - 40) / L));

    if (!padCols) rect(ctx, x0 + L * laneW, top, 1, hitY - top + 8, '#2a2450');
    // beat lines
    const pxPerSec = (hitY - top) / this.approach;
    for (let b = Math.ceil(this.now / this.song.beat); ; b++) {
      const t = b * this.song.beat; const y = hitY - (t - this.now) * pxPerSec;
      if (y < top) break;
      for (let l = 0; l < L; l++) rect(ctx, laneX(l), y, laneW, 1, b % 4 === 0 ? '#3a3560' : '#242040');
    }
    // notes
    for (const n of this.notes) {
      if (n.sec !== this.secIdx) continue;
      const y = hitY - (n.t - this.now) * pxPerSec;
      if (y < top - 10) break;
      if (n.judged && !n.holding && (n.type !== 'hold' || n.tailJudged || !n.hit)) { if (n.type !== 'hold' || !n.hit) continue; }
      const x = laneX(n.lane) + 3, w = laneW - 6;
      const col = LANE_COLORS[n.lane];
      if (n.type === 'hold') {
        const yEnd = hitY - (n.t + n.dur - this.now) * pxPerSec;
        const yStart = n.holding ? hitY : y;
        if (yEnd < hitY + 4) {
          const yy = Math.max(top, yEnd), hh = Math.min(hitY + 3, yStart) - yy;
          if (hh > 0) rect(ctx, x + w / 2 - 3, yy, 6, hh, n.holding ? col : shade(col, -60));
        }
        if (n.tailJudged && n.hit) continue;
      }
      if (n.judged && n.hit && (!n.holding)) continue;
      if (y > hitY + 12) continue;
      if (n.holding) continue;
      rect(ctx, x, y - 3, w, 6, col);
      rect(ctx, x + 1, y - 2, w - 2, 1, shade(col, 60));
      rect(ctx, x, y + 3, w, 1, shade(col, -50));
    }
  }
  drawTaiko(ctx, A) {
    const hitX = A.x + 52, cy = A.y + A.h * (A.touch ? 0.6 : 0.5) - 6;
    const lineH = A.touch ? 60 : 44, lineTop = cy - lineH / 2;
    rect(ctx, A.x, lineTop, A.w, lineH, '#1a1428');
    rect(ctx, A.x, lineTop, A.w, 1, '#3a3060'); rect(ctx, A.x, lineTop + lineH, A.w, 1, '#3a3060');
    const pxPerSec = (A.w - 60) / this.approach;
    for (let b = Math.ceil(this.now / this.song.beat); ; b++) {
      const t = b * this.song.beat; const x = hitX + (t - this.now) * pxPerSec;
      if (x > A.x + A.w) break;
      if (x > A.x) rect(ctx, x, lineTop, 1, lineH, b % 4 === 0 ? '#4a4070' : '#2a2448');
    }
    // hit circle
    ringPx(ctx, hitX, cy, 12, '#666'); ringPx(ctx, hitX, cy, 11, '#444');
    if (this.flashes.don > 0) circle(ctx, hitX, cy, 10, '#ff6b6b');
    else if (this.flashes.ka > 0) circle(ctx, hitX, cy, 10, '#5bc0ff');
    // drum face left
    rect(ctx, A.x + 2, cy - 18, 32, 36, '#5a3a1e'); rect(ctx, A.x + 6, cy - 14, 24, 28, '#f0e8d8');
    if (A.touch) { drawText(ctx, 'BIG NOTES: BOTH DON PADS', A.x + A.w / 2, A.y + A.h - 12, '#6b5f9a', { align: 'center' }); }
    drawText(ctx, 'D K', A.x + 18, cy - 24, '#5bc0ff', { align: 'center' });
    drawText(ctx, 'F J', A.x + 18, cy + 22, '#ff6b6b', { align: 'center' });
    // notes, draw far ones first
    const visible = [];
    for (const n of this.notes) {
      if (n.sec !== this.secIdx) continue;
      if (n.judged && n.type !== 'roll') continue;
      const x = hitX + (n.t - this.now) * pxPerSec;
      if (x > A.x + A.w + 20) break;
      if (x < A.x - 20 && n.type !== 'roll') continue;
      visible.push({ n, x });
    }
    for (let i = visible.length - 1; i >= 0; i--) {
      const { n, x } = visible[i];
      if (n.type === 'roll') {
        const xe = hitX + (n.t + n.dur - this.now) * pxPerSec;
        const xs = Math.max(hitX, x);
        if (xe > A.x) { rect(ctx, xs, cy - 7, Math.max(0, xe - xs), 14, '#ffd166'); circle(ctx, xe, cy, 7, '#ffd166'); circle(ctx, xs, cy, 7, '#ffd166'); drawText(ctx, 'ROLL!', (xs + xe) / 2, cy - 16, '#ffd166', { align: 'center' }); }
        continue;
      }
      const big = n.type === 'big'; const r = big ? 12 : 8;
      const col = n.type === 'ka' ? '#5bc0ff' : '#ff6b6b';
      circle(ctx, x, cy, r, '#111'); circle(ctx, x, cy, r - 1, col); circle(ctx, x, cy, r - 4, shade(col, 50));
      if (big) drawText(ctx, 'FJ', x, cy - 2, '#000', { align: 'center' });
    }
  }
  drawWind(ctx, A) {
    const hitX = A.x + 70, top = A.y + (A.touch ? 14 : 22), bot = A.y + A.h - (A.touch ? 24 : 30);
    rect(ctx, A.x, top - 4, A.w, bot - top + 8, '#141126');
    for (let i = 0; i <= 4; i++) rect(ctx, A.x, top + (bot - top) * i / 4, A.w, 1, '#2a2450');
    const pxPerSec = (A.w - 80) / this.approach;
    for (let b = Math.ceil(this.now / this.song.beat); ; b++) {
      const t = b * this.song.beat; const x = hitX + (t - this.now) * pxPerSec;
      if (x > A.x + A.w) break;
      if (x > A.x) rect(ctx, x, top - 4, 1, bot - top + 8, b % 4 === 0 ? '#4a4070' : '#242040');
    }
    // hit line
    rect(ctx, hitX, top - 6, 2, bot - top + 12, this.keysDown.has('Space') ? '#ffe14d' : '#887');
    for (const n of this.notes) {
      if (n.sec !== this.secIdx) continue;
      const xs = hitX + (n.t - this.now) * pxPerSec, xe = hitX + (n.t + n.dur - this.now) * pxPerSec;
      if (xs > A.x + A.w + 10) break;
      if (xe < A.x - 10) continue;
      const y = bot - (bot - top) * n.pitch;
      let col = '#e0b040';
      if (n.judged && !n.hit) col = '#553';
      else if (n.holding) col = '#ffe14d';
      else if (n.tailJudged) col = '#6ff08a';
      const x1 = Math.max(A.x, xs), x2 = Math.min(A.x + A.w, xe);
      if (x2 > x1) rect(ctx, x1, y - 3, x2 - x1, 7, col);
      if (xs >= A.x) { rect(ctx, xs, y - 5, 3, 11, shade(col, 60)); }
      if (xe <= A.x + A.w) rect(ctx, xe - 2, y - 5, 3, 11, shade(col, -40));
    }
    // breath meter
    const bw = 100, bx = A.x + A.w / 2 - bw / 2, by = A.y + A.h - 16;
    rect(ctx, bx, by, bw, 6, '#222'); rect(ctx, bx, by, bw * this.breath, 6, this.breath < 0.25 ? '#ff5a5a' : '#6fb8ff'); frame(ctx, bx, by, bw, 6, '#889');
    drawText(ctx, 'BREATH', bx - 4, by, '#aab', { align: 'right' });
    drawText(ctx, 'HOLD SPACE', bx + bw + 6, by, '#aab');
  }
  drawValves(ctx, A) {
    const hitX = A.x + 60, cy = A.y + A.h * (A.touch ? 0.52 : 0.5) - 14;
    rect(ctx, A.x, cy - 22, A.w, 44, '#141126');
    const pxPerSec = (A.w - 70) / this.approach;
    for (let b = Math.ceil(this.now / this.song.beat); ; b++) {
      const t = b * this.song.beat; const x = hitX + (t - this.now) * pxPerSec;
      if (x > A.x + A.w) break;
      if (x > A.x) rect(ctx, x, cy - 20, 1, 40, b % 4 === 0 ? '#4a4070' : '#242040');
    }
    ringPx(ctx, hitX, cy, 13, '#777');
    for (const n of this.notes) {
      if (n.sec !== this.secIdx || n.judged) continue;
      const x = hitX + (n.t - this.now) * pxPerSec;
      if (x > A.x + A.w + 14) break;
      if (x < A.x - 14) continue;
      circle(ctx, x, cy, 13, '#f0c040'); circle(ctx, x, cy, 12, '#c89a2a');
      for (let v = 0; v < 3; v++) {
        const on = (n.combo >> v) & 1;
        rect(ctx, x - 8 + v * 5, cy - 6, 4, 12, on ? '#fff' : '#5a4210');
        if (on) drawText(ctx, this.instrument.keyNames[v], x - 7 + v * 5, cy - 2, '#000');
      }
    }
    // valve buttons (the touch pads stand in for these)
    const names = this.instrument.keyNames;
    if (!A.touch) for (let v = 0; v < 3; v++) {
      const bx = A.x + A.w / 2 - 36 + v * 26, by = A.y + A.h - 30;
      const on = (this.valveMask >> v) & 1;
      rect(ctx, bx, by + (on ? 3 : 0), 20, 14 - (on ? 3 : 0), on ? '#ffe14d' : '#8a6a20'); frame(ctx, bx, by + (on ? 3 : 0), 20, 14 - (on ? 3 : 0), '#fff');
      drawText(ctx, names[v], bx + 10, by + 5 + (on ? 2 : 0), '#000', { align: 'center' });
    }
    drawText(ctx, 'PRESS THE LIT VALVES TOGETHER', A.x + A.w / 2, A.y + A.h - (A.touch ? 8 : 10), '#aab', { align: 'center' });
  }
  drawBow(ctx, A) {
    const hitX = A.x + 70, top = A.y + (A.touch ? 14 : 24), bot = A.y + A.h - (A.touch ? 16 : 30);
    rect(ctx, A.x, top - 6, A.w, bot - top + 12, '#141126');
    for (let i = 0; i < 4; i++) rect(ctx, A.x, top + (bot - top) * i / 3, A.w, 1, '#3a3560');
    const pxPerSec = (A.w - 80) / this.approach;
    for (let b = Math.ceil(this.now / this.song.beat); ; b++) {
      const t = b * this.song.beat; const x = hitX + (t - this.now) * pxPerSec;
      if (x > A.x + A.w) break;
      if (x > A.x) rect(ctx, x, top - 6, 1, bot - top + 12, b % 4 === 0 ? '#4a4070' : '#242040');
    }
    rect(ctx, hitX, top - 8, 2, bot - top + 16, '#887');
    if (this.flashes[1] > 0) rect(ctx, hitX - 3, top - 8, 8, (bot - top) / 2 + 8, '#c58bff');
    if (this.flashes[0] > 0) rect(ctx, hitX - 3, top + (bot - top) / 2, 8, (bot - top) / 2 + 8, '#6be585');
    for (const n of this.notes) {
      if (n.sec !== this.secIdx) continue;
      const xs = hitX + (n.t - this.now) * pxPerSec;
      if (xs > A.x + A.w + 10) break;
      const xe = n.dur ? hitX + (n.t + n.dur - this.now) * pxPerSec : xs;
      if (xe < A.x - 10) continue;
      if (n.judged && !n.holding && (!n.type === 'hold' || n.tailJudged || !n.hit)) { if (!(n.type === 'hold' && n.hit && !n.tailJudged)) continue; }
      const y = bot - (bot - top) * n.pitch;
      const col = n.dir > 0 ? '#c58bff' : '#6be585';
      if (n.dur) { const x1 = Math.max(A.x, n.holding ? hitX : xs), x2 = Math.min(A.x + A.w, xe); if (x2 > x1) rect(ctx, x1, y - 2, x2 - x1, 5, n.holding ? '#fff' : shade(col, -50)); }
      if (n.holding) continue;
      // arrow
      circle(ctx, xs, y, 6, col);
      drawText(ctx, n.dir > 0 ? '↑' : '↓', xs, y - 2, '#000', { align: 'center' });
    }
    if (!A.touch) {
      drawText(ctx, 'UP BOW = ↑ / W', A.x + 6, A.y + A.h - 12, '#c58bff');
      drawText(ctx, 'DOWN BOW = ↓ / S', A.x + A.w - 6, A.y + A.h - 12, '#6be585', { align: 'right' });
    }
  }
}

// ===== js/crowd.js =====
// ---------- Passers-by, watchers, coins ----------
'use strict';
class Crowd {
  // mods: {crowd, tips, watchTime, wealth}
  constructor(venue, mods, rng) {
    this.venue = venue; this.mods = mods; this.rng = rng;
    this.peds = []; this.coins = []; this.popups = []; this.particles = [];
    this.earned = 0; this.tipCount = 0; this.spawnAcc = 1.5; this.hype = 20;
    this.stageX = 110; this.hatX = 150; this.hatY = 0; this.groundY = 0;
    this.watchersMax = 8; this.time = 0;
    this.cheerFlash = 0;
  }
  get watchers() { return this.peds.filter(p => p.state === 'watch'); }
  spawn() {
    const r = this.rng;
    const dir = r.chance(0.5) ? 1 : -1;
    const row = r.int(0, 2);
    const species = r.pick(SPECIES_KEYS);
    const hue = r.pick(['#c04040', '#4070c0', '#40a060', '#c0a040', '#8050b0', '#d07030', '#3aa0a0', '#b04080', '#777']);
    this.peds.push({
      x: dir > 0 ? -20 : W + 20, dir, row, species, speed: r.range(14, 26),
      override: { s: hue }, hat: r.chance(0.35) ? r.pick(Object.keys(HATS)) : null,
      state: 'walk', t: r.range(0, 10), watchT: 0, tipT: r.range(2, 5), generous: r.range(0.6, 1.6),
      attention: r.range(0.5, 1.4), stopX: null, bob: r.range(0, 6), tipped: 0,
    });
  }
  // events: {perfects, misses, cheer} since last frame
  update(dt, hype, ev) {
    this.time += dt;
    this.hype = hype;
    const traffic = this.venue.traffic * this.mods.crowd;
    this.spawnAcc += dt * traffic * 0.42;
    while (this.spawnAcc >= 1) { this.spawnAcc -= 1; if (this.peds.length < 26) this.spawn(); }
    const attractRange = 70 * (this.mods.range || 1);
    let watchers = this.watchers.length;
    for (const p of this.peds) {
      p.t += dt;
      if (p.state === 'walk' || p.state === 'leave') {
        p.x += p.dir * p.speed * dt;
        if (p.state === 'walk' && Math.abs(p.x - this.stageX) < attractRange && watchers < this.watchersMax) {
          const pStop = (hype / 100) * 0.9 * p.attention * dt;
          if (this.rng.chance(pStop)) {
            p.state = 'watch'; watchers++;
            p.watchT = this.rng.range(8, 14) * this.mods.watchTime;
            p.tipT = this.rng.range(1.5, 4);
            // find a spot in front of the stage
            p.stopX = this.stageX + this.rng.range(-60, 60);
            p.row = this.rng.int(0, 2);
          }
        }
      } else if (p.state === 'watch') {
        // shuffle to stop spot
        if (Math.abs(p.x - p.stopX) > 1) { const d = Math.sign(p.stopX - p.x); p.x += d * 20 * dt; p.dir = d; }
        else p.dir = p.x < this.stageX ? 1 : -1;
        p.watchT -= dt;
        if (hype > 60) p.watchT += dt * 0.6; // hooked
        p.tipT -= dt;
        if (p.tipT <= 0) {
          p.tipT = this.rng.range(3, 6);
          if (this.rng.chance(clamp(hype / 100 + 0.1, 0.15, 1))) this.tip(p, 1);
        }
        if (ev.misses > 0 && this.rng.chance(0.18 * ev.misses * (hype < 40 ? 1.6 : 1))) { p.state = 'leave'; p.dir = this.rng.chance(0.5) ? 1 : -1; }
        if (p.watchT <= 0 || (hype < 15 && this.rng.chance(dt * 0.5))) { p.state = 'leave'; p.dir = this.rng.chance(0.5) ? 1 : -1; }
      }
    }
    if (ev.cheer) {
      this.cheerFlash = 1;
      for (const p of this.watchers) this.tip(p, ev.cheer);
      Audio.applause(clamp(this.watchers.length / 8, 0.2, 1));
    }
    this.cheerFlash = Math.max(0, this.cheerFlash - dt * 2);
    this.peds = this.peds.filter(p => p.x > -30 && p.x < W + 30);
    // coins
    for (const c of this.coins) {
      c.t += dt / c.dur;
      if (c.t >= 1 && !c.done) {
        c.done = true; this.earned += c.value; this.tipCount++;
        Audio.ui(c.bill ? 'bill' : 'coin');
        this.popups.push({ x: this.hatX, y: this.hatY - 6, text: '+' + fmtMoney(c.value), t: 0, color: c.bill ? '#9af09a' : '#ffe680' });
        for (let i = 0; i < 4; i++) this.particles.push({ x: this.hatX + 4, y: this.hatY, vx: this.rng.range(-20, 20), vy: this.rng.range(-40, -10), t: 0 });
      }
    }
    this.coins = this.coins.filter(c => !c.done);
    for (const p of this.popups) { p.t += dt; p.y -= dt * 14; }
    this.popups = this.popups.filter(p => p.t < 1.2);
    for (const p of this.particles) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 80 * dt; }
    this.particles = this.particles.filter(p => p.t < 0.6);
  }
  tip(p, mult) {
    const wealth = this.venue.wealth * (this.mods.wealth || 1);
    let value, bill = false;
    const roll = this.rng() * p.generous * (0.6 + this.hype / 120);
    if (roll > 1.3 && this.hype > 60) { bill = true; value = this.rng.pick([1, 1, 2, 2, 5]) * (wealth > 1.5 ? 2 : 1); }
    else value = this.rng.pick([0.25, 0.5, 0.5, 1]) * (wealth >= 1.4 ? 2 : 1);
    value = Math.round(value * wealth * this.mods.tips * mult * 4) / 4;
    value = Math.max(0.25, value);
    p.tipped++;
    this.coins.push({ x0: p.x + 8, y0: this.groundY - 8 - p.row * 3, t: 0, dur: 0.55 + this.rng() * 0.2, value, bill, done: false });
  }
  drawPeds(ctx, groundY, layer) {
    // layer 0 = behind band (rows far), layer 1 = in front
    const rows = layer === 0 ? [2] : [1, 0];
    for (const row of rows) {
      for (const p of this.peds) {
        if (p.row !== row) continue;
        const walking = p.state !== 'watch' || Math.abs(p.x - p.stopX) > 1;
        const pose = walking ? (Math.floor(p.t * 6) % 2 ? 'walk' : 'stand') : (this.cheerFlash > 0 ? 'play' : 'stand');
        const y = groundY - 18 + 4 - row * 3 + (p.state === 'watch' && !walking ? Math.round(Math.sin(this.time * 6 + p.bob) * (this.hype > 60 ? 1 : 0)) : 0);
        drawBug(ctx, p.species, p.x, y, { pose, flip: p.dir < 0, override: p.override, hat: p.hat });
        if (p.state === 'watch' && this.hype > 70 && Math.floor(this.time * 2 + p.bob) % 3 === 0) {
          ctx.drawImage(propSprite('heart'), Math.round(p.x + 6), Math.round(y - 6 - Math.sin(this.time * 4 + p.bob) * 2));
        } else if (p.state === 'watch' && Math.floor(this.time * 1.5 + p.bob) % 4 === 0) {
          ctx.drawImage(propSprite('note'), Math.round(p.x + 7), Math.round(y - 6));
        }
      }
    }
  }
  drawCoins(ctx) {
    for (const c of this.coins) {
      const t = clamp(c.t, 0, 1);
      const x = lerp(c.x0, this.hatX + 3, t);
      const y = lerp(c.y0, this.hatY, t) - Math.sin(t * Math.PI) * 28;
      const spr = propSprite(c.bill ? 'bill' : 'coin');
      ctx.drawImage(spr, Math.round(x), Math.round(y));
    }
    for (const p of this.particles) rect(ctx, p.x, p.y, 1, 1, '#ffe680');
    for (const p of this.popups) {
      ctx.globalAlpha = clamp(1.5 - p.t, 0, 1);
      drawText(ctx, p.text, p.x + 4, p.y, p.color, { align: 'center', shadow: '#000' });
      ctx.globalAlpha = 1;
    }
  }
}

// ===== js/mapgen.js =====
// ---------- Slay-the-Spire-style map of San Francisco ----------
'use strict';
const MAP_ROWS = 15;      // regular rows; row 15 = boss
const MAP_COLS = 7;
const ROWS_PER_DAY = 3;
const MAP_ROW_H = 30;

function generateMap(rng) {
  const grid = []; // grid[r][c] = node or null
  for (let r = 0; r <= MAP_ROWS; r++) { grid.push(new Array(MAP_COLS).fill(null)); }
  const edges = new Set(); // "r,c>c2"
  const node = (r, c) => grid[r][c] || (grid[r][c] = { r, c, type: 'gig', next: [], prev: [], visited: false, x: 0, y: 0 });
  const crosses = (r, c, c2) => {
    // would edge (r,c)->(r+1,c2) cross an existing edge?
    if (c2 === c + 1 && edges.has(r + ',' + (c + 1) + '>' + c)) return true;
    if (c2 === c - 1 && edges.has(r + ',' + (c - 1) + '>' + c)) return true;
    return false;
  };
  const numPaths = 6;
  const starts = [];
  for (let i = 0; i < numPaths; i++) {
    let c = rng.int(1, MAP_COLS - 2);
    if (i === 1) { let tries = 0; while (c === starts[0] && tries++ < 10) c = rng.int(0, MAP_COLS - 1); }
    starts.push(c);
    node(0, c);
    for (let r = 0; r < MAP_ROWS - 1; r++) {
      const opts = [c - 1, c, c + 1].filter(x => x >= 0 && x < MAP_COLS && !crosses(r, c, x));
      const c2 = opts.length ? rng.pick(opts) : c;
      const a = node(r, c), b = node(r + 1, c2);
      if (!a.next.includes(b)) { a.next.push(b); b.prev.push(a); }
      edges.add(r + ',' + c + '>' + c2);
      c = c2;
    }
    // connect last regular row to boss
    const boss = node(MAP_ROWS, 3);
    const last = grid[MAP_ROWS - 1][c];
    if (!last.next.includes(boss)) { last.next.push(boss); boss.prev.push(last); }
  }
  // Assign types
  const all = [];
  for (let r = 0; r <= MAP_ROWS; r++) for (let c = 0; c < MAP_COLS; c++) if (grid[r][c]) all.push(grid[r][c]);
  for (const n of all) {
    const day = Math.min(4, Math.floor(n.r / ROWS_PER_DAY));
    n.day = day;
    if (n.r === MAP_ROWS) { n.type = 'boss'; n.venue = 'bridge'; continue; }
    if (n.r === 0) { n.type = 'gig'; }
    else if (n.r === 7) { n.type = 'treasure'; }
    else {
      const roll = rng();
      const prevTypes = n.prev.map(p => p.type);
      if (roll < 0.13 && n.r >= 3) n.type = 'elite';
      else if (roll < 0.26) n.type = 'shop';
      else if (roll < 0.47) n.type = 'event';
      else if (roll < 0.56 && !prevTypes.includes('rest') && n.r % ROWS_PER_DAY !== ROWS_PER_DAY - 1) n.type = 'rest';
      else if (roll < 0.65) n.type = 'openmic';
      else n.type = 'gig';
      // no two shops in a row on the same path
      if (n.type === 'shop' && prevTypes.includes('shop')) n.type = 'gig';
      if (n.type === 'event' && prevTypes.every(t => t === 'event') && prevTypes.length) n.type = 'gig';
    }
    if (n.type === 'gig' || n.type === 'elite' || n.type === 'openmic') n.venue = rng.pick(DAY_VENUES[day]);
  }
  // Guarantee: the last row before each dinner has a gig or elite in most spots (money before meal)
  for (let d = 0; d < 5; d++) {
    const r = d * ROWS_PER_DAY + ROWS_PER_DAY - 1;
    const rowNodes = grid[r].filter(Boolean);
    if (!rowNodes.some(n => n.type === 'gig' || n.type === 'elite')) { const n = rng.pick(rowNodes); n.type = 'gig'; n.venue = rng.pick(DAY_VENUES[d]); }
  }
  // positions (row 0 at bottom)
  for (const n of all) {
    n.x = 48 + n.c * 40 + (n.type === 'boss' ? 0 : rng.int(-5, 5));
    n.y = (MAP_ROWS - n.r) * MAP_ROW_H + 30 + (n.type === 'boss' ? 0 : rng.int(-4, 4));
  }
  const boss = grid[MAP_ROWS][3]; boss.x = 48 + 3 * 40; boss.y = 22;
  return { grid, nodes: all, boss };
}

'use strict';

function drawBackdropCity(ctx, t, opts = {}) {
  // night sky + bay + hills. Used by title and map.
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0a0820'); grad.addColorStop(0.6, '#1c1640'); grad.addColorStop(1, '#3a2a58');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  // stars
  const r = makeRng(7);
  for (let i = 0; i < 70; i++) { const x = r.int(0, W), y = r.int(0, 120); const tw = Math.sin(t * 2 + i) > 0.6; rect(ctx, x, y, 1, 1, tw ? '#fff' : '#8a86b0'); }
  // moon
  circle(ctx, 400, 36, 12, '#f4f0d8'); circle(ctx, 405, 33, 11, opts.moonBg || '#0f0c2a');
}

// ---------- Map ----------
class MapScene {
  constructor(intro) {
    this.t = 0; this.camY = 0; this.introT = intro ? 2.2 : 0; this.dayBanner = intro ? 2.5 : 0;
    this.refresh();
  }
  enter() { const r = Game.run; if (r.dayBannerPending) { this.dayBanner = 2.5; r.dayBannerPending = false; } }
  refresh() {
    const r = Game.run; const cur = r.current;
    this.avail = cur ? cur.next.slice() : r.map.grid[0].filter(Boolean);
    this.sel = 0;
    const focusY = cur ? cur.y : 480;
    this.camY = clamp(focusY - 175, 0, 300);
  }
  update(dt) {
    this.t += dt; this.introT = Math.max(0, this.introT - dt); this.dayBanner = Math.max(0, this.dayBanner - dt);
    this.userPan = Math.max(0, (this.userPan || 0) - dt);
    if (this.userPan > 0) return;
    const cur = Game.run.current; const focusY = cur ? cur.y : 480;
    const target = clamp(focusY - 175, 0, 300);
    this.camY = lerp(this.camY, target, Math.min(1, dt * 4));
  }
  key(code) {
    if (code === 'ArrowLeft' || code === 'KeyA') { this.sel = (this.sel - 1 + this.avail.length) % this.avail.length; Audio.ui('move'); }
    else if (code === 'ArrowRight' || code === 'KeyD') { this.sel = (this.sel + 1) % this.avail.length; Audio.ui('move'); }
    else if (code === 'Enter' || code === 'Space' || code === 'KeyZ') { this.go(this.avail[this.sel]); }
    else if (code === 'Tab' || code === 'KeyB') { Game.setScene(new BandScene()); }
    else if (code === 'Escape') { Game.run.save(); Game.setScene(new TitleScene()); }
  }
  click(x, y) { this.tap(x, y); }
  tap(x, y) {
    if (y >= H - 14 && x >= W - 148) { Game.setScene(new BandScene()); return; }
    if (y >= H - 14 && x >= W - 300 && x < W - 152) { Game.run.save(); Game.setScene(new TitleScene()); return; }
    const reach = Game.touch ? 16 : 10;
    let best = null, bestD = Infinity;
    for (const n of this.avail) {
      const sy = n.y - this.camY; const d = Math.hypot(x - n.x, y - sy);
      if (d < reach && d < bestD) { best = n; bestD = d; }
    }
    if (best) this.go(best);
  }
  pointerDown(x, y, id) { this.drag = { y, camY: this.camY, moved: 0, id }; }
  pointerMove(x, y, id) {
    if (!this.drag || this.drag.id !== id) return;
    const dy = y - this.drag.y;
    this.drag.moved = Math.max(this.drag.moved, Math.abs(dy));
    if (this.drag.moved > 5 && x < 332) { this.camY = clamp(this.drag.camY - dy, 0, 300); this.userPan = 2.5; }
  }
  pointerUp(x, y, id) {
    if (!this.drag || this.drag.id !== id) return;
    const moved = this.drag.moved; this.drag = null;
    if (moved <= 5 && x >= 0) this.tap(x, y);
  }
  hover(x, y) { this.avail.forEach((n, i) => { const sy = n.y - this.camY; if (Math.abs(x - n.x) < 10 && Math.abs(y - sy) < 10) this.sel = i; }); }
  go(node) {
    const r = Game.run; Audio.ui('select');
    node.visited = true; r.current = node;
    switch (node.type) {
      case 'gig': case 'elite': case 'boss': case 'openmic': Game.setScene(new PerformScene(node)); break;
      case 'shop': Game.setScene(new ShopScene(node)); break;
      case 'event': Game.setScene(new EventScene(node)); break;
      case 'rest': Game.setScene(new RestScene(node)); break;
      case 'treasure': Game.setScene(new TreasureScene(node)); break;
    }
  }
  nodeColor(n) { return { gig: '#6fb8ff', elite: '#ffd040', boss: '#ff5a5a', shop: '#f0a050', event: '#80d0ff', rest: '#d05070', treasure: '#ffd040', openmic: '#c58bff' }[n.type] || '#fff'; }
  nodeLabel(n) { return { gig: 'GIG', elite: 'BIG GIG', boss: 'FINALE', shop: 'MUSIC SHOP', event: '???', rest: 'REST', treasure: 'TREASURE', openmic: 'OPEN MIC' }[n.type]; }
  draw(ctx) {
    const r = Game.run; const cam = this.camY;
    drawBackdropCity(ctx, this.t, { moonBg: '#0d0a26' });
    // bay water on the right of map area, hills left
    ctx.save(); ctx.beginPath(); ctx.rect(0, 13, 330, H - 13); ctx.clip();
    for (let y = 0; y < H; y += 1) { const wy = y + cam; if ((wy + Math.floor(this.t * 6)) % 8 === 0) rect(ctx, 250 + Math.sin(wy * 0.05) * 20, y, 80, 1, '#2a3a70'); }
    rect(ctx, 0, 13, 330, H, 'rgba(20,16,44,0.35)');
    // districts / streets grid faint
    for (let gy = -((cam) % 30); gy < H; gy += 30) rect(ctx, 0, gy, 330, 1, 'rgba(120,110,170,0.12)');
    for (let gx = 0; gx < 330; gx += 40) rect(ctx, gx + 8, 13, 1, H, 'rgba(120,110,170,0.12)');
    this.drawLandmarks(ctx, cam);
    // day separators
    for (let d = 1; d <= 5; d++) {
      const rowY = (MAP_ROWS - (d * ROWS_PER_DAY - 0.5)) * MAP_ROW_H + 30 - cam;
      if (rowY < 13 || rowY > H) continue;
      dashedLine(ctx, 0, rowY, 330, rowY, '#6b5f9a', 4, 4, this.t * 10);
      rect(ctx, 2, rowY - 8, textWidth('NIGHTFALL: DINNER ' + d) + 4, 8, '#0a0820');
      drawText(ctx, 'NIGHTFALL: DINNER ' + d, 4, rowY - 7, '#9a8fd0');
      if (d < 5) { const lbl = 'DAY ' + (d + 1) + ': ' + DAY_NAMES[d].toUpperCase(); rect(ctx, 2, rowY + 2, textWidth(lbl) + 4, 8, '#0a0820'); drawText(ctx, lbl, 4, rowY + 3, '#6b5f9a'); }
    }
    // edges
    for (const n of r.map.nodes) for (const m of n.next) {
      const onPath = n.visited && m.visited;
      const avail = n === r.current && this.avail.includes(m);
      const col = onPath ? '#ffe680' : avail ? '#cfc9e6' : '#4a4470';
      dashedLine(ctx, n.x, n.y - cam, m.x, m.y - cam, col, 2, 3, avail ? this.t * 12 : 0);
    }
    // nodes
    for (const n of r.map.nodes) {
      const y = n.y - cam; if (y < 8 || y > H + 8) continue;
      const isCur = n === r.current, isAvail = this.avail.includes(n);
      const big = n.type === 'boss' || n.type === 'elite';
      const rad = big ? 9 : 7;
      const pulse = isAvail ? Math.round(Math.sin(this.t * 6) * 1.5 + 1.5) : 0;
      if (isAvail) ringPx(ctx, n.x, y, rad + 3 + pulse, this.avail[this.sel] === n ? '#fff' : '#cfc9e6');
      circle(ctx, n.x, y, rad, isCur ? '#ffe680' : n.visited ? '#3a3560' : '#1a1730');
      ringPx(ctx, n.x, y, rad, n.visited && !isCur ? '#6b5f9a' : this.nodeColor(n));
      const ic = iconSprite(n.type);
      ctx.globalAlpha = n.visited && !isCur ? 0.5 : 1;
      ctx.drawImage(ic, n.x - 4, y - 4); ctx.globalAlpha = 1;
    }
    // party marker
    if (r.current) { const y = r.current.y - cam; drawBug(ctx, r.members[0].species, r.current.x - 8, y - 26 + Math.round(Math.sin(this.t * 5)), { pose: 'stand', instrument: r.members[0].instrument }); }
    else { const n = this.avail[this.sel]; drawText(ctx, 'START HERE', n.x, n.y - cam + 12, '#ffe680', { align: 'center', shadow: '#000' }); }
    // selected tooltip
    const s = this.avail[this.sel];
    if (s) {
      const ty = s.y - cam - 22 - (s.type === 'boss' ? 6 : 0);
      const label = this.nodeLabel(s) + (s.venue ? ': ' + VENUES[s.venue].name.toUpperCase() : '');
      const tw = textWidth(label) + 8; const tx = clamp(s.x - tw / 2, 2, 330 - tw);
      rect(ctx, tx, ty - 2, tw, 9, '#000'); drawText(ctx, label, tx + 4, ty, this.nodeColor(s));
    }
    ctx.restore();
    // right panel
    this.drawPanel(ctx);
    Game.drawRunHud(ctx);
    if (this.dayBanner > 0) {
      ctx.globalAlpha = clamp(this.dayBanner, 0, 1);
      rect(ctx, 0, 110, W, 40, '#000');
      drawText(ctx, 'DAY ' + (r.day + 1), W / 2, 116, '#ffe14d', { align: 'center', scale: 2 });
      drawText(ctx, DAY_NAMES[Math.min(4, r.day)].toUpperCase(), W / 2, 134, '#fff', { align: 'center' });
      ctx.globalAlpha = 1;
    }
  }
  drawLandmarks(ctx, cam) {
    // world-space decorations kept clear of the node columns (nodes span x 43..295)
    const y0 = -cam;
    // Golden Gate bridge at the top
    rect(ctx, 0, y0 + 40, 330, 2, '#c03a2a');
    for (const bx of [70, 210]) { rect(ctx, bx, y0 + 8, 4, 34, '#c03a2a'); rect(ctx, bx + 8, y0 + 8, 4, 34, '#c03a2a'); rect(ctx, bx - 1, y0 + 8, 14, 2, '#c03a2a'); }
    for (let x = 0; x < 330; x += 3) { const c = Math.abs(((x + 70) % 140) - 70) / 70; rect(ctx, x, y0 + 12 + Math.round(c * c * 28), 1, 1, '#e05040'); }
    // Coit tower + Transamerica pyramid on the bay side
    rect(ctx, 318, y0 + 150, 5, 22, '#d8d0c0'); rect(ctx, 317, y0 + 148, 7, 3, '#e8e0d0');
    for (let i = 0; i < 12; i++) rect(ctx, 302 + i / 2, y0 + 205 + i, 12 - i, 1, '#c8c8d8');
    rect(ctx, 307, y0 + 195, 2, 10, '#e0e0f0');
    // painted ladies
    const cols = ['#c86a8a', '#6a9ac8', '#c8b06a', '#8ac86a', '#a86ac8'];
    for (let i = 0; i < 5; i++) { const x = 300 + i * 6; rect(ctx, x, y0 + 382, 5, 14, cols[i]); rect(ctx, x + 1, y0 + 379, 3, 3, shade(cols[i], -30)); rect(ctx, x + 2, y0 + 386, 1, 3, '#fff0c0'); }
    // Sutro tower on the ocean side
    rect(ctx, 14, y0 + 430, 2, 40, '#c04040'); rect(ctx, 20, y0 + 430, 2, 40, '#c04040'); rect(ctx, 8, y0 + 436, 20, 2, '#c04040'); rect(ctx, 10, y0 + 450, 16, 2, '#c04040');
    // Dolores park palms
    for (let i = 0; i < 2; i++) ctx.drawImage(propSprite('tree'), 302 + i * 14, y0 + 440);
    drawText(ctx, 'BAY', 308, y0 + 300, '#3a5aa0'); drawText(ctx, 'OCEAN', 4, y0 + 240, '#3a5aa0');
  }
  drawPanel(ctx) {
    const r = Game.run;
    panel(ctx, 332, 14, W - 334, H - 16);
    let y = 20;
    drawText(ctx, 'THE BAND', 340, y, '#ffe14d'); y += 9;
    for (const m of r.members) {
      drawBug(ctx, m.species, 338, y - 2, { pose: 'stand', instrument: m.instrument });
      drawText(ctx, m.name.toUpperCase(), 358, y, '#fff');
      drawText(ctx, INSTRUMENTS[m.instrument].name, 358, y + 7, '#cfc9e6');
      // stamina bar
      rect(ctx, 358, y + 14, 60, 3, '#222'); rect(ctx, 358, y + 14, 60 * m.stamina / 100, 3, m.stamina > 50 ? '#6be585' : m.stamina > 25 ? '#ffd166' : '#ff5a5a');
      drawText(ctx, 'SK' + m.skill, 422, y + 7, '#9a8fd0');
      drawText(ctx, '★'.repeat(m.quality), 422, y, '#ffe680');
      if (m.hunger > 0) drawText(ctx, m.hunger >= 2 ? 'STARVING' : 'HUNGRY', 422, y + 13, m.hunger >= 2 ? '#ff5a5a' : '#ff9f68');
      y += 20;
    }
    y += 2; drawText(ctx, 'RELICS', 340, y, '#ffe14d'); y += 8;
    r.relics.forEach((k, i) => ctx.drawImage(iconSprite(ITEMS[k].icon), 340 + (i % 14) * 10, y + Math.floor(i / 14) * 10));
    if (!r.relics.length) drawText(ctx, '(none yet)', 340, y, '#6b5f9a');
    y += 10 + Math.floor(Math.max(0, r.relics.length - 1) / 14) * 10;
    drawText(ctx, 'ITEMS', 340, y, '#ffe14d'); y += 8;
    r.consumables.forEach((k, i) => ctx.drawImage(iconSprite(ITEMS[k].icon), 340 + i * 10, y));
    if (!r.consumables.length) drawText(ctx, '(none)', 340, y, '#6b5f9a');
    y += 12;
    drawText(ctx, 'TONIGHT\'S DINNER:', 340, y, '#cfc9e6'); y += 7;
    drawText(ctx, fmtMoney(r.mealPrice()) + ' x ' + r.members.length + ' = ' + fmtMoney(r.mealPrice() * r.members.length), 340, y, r.money >= r.mealPrice() * r.members.length ? '#6be585' : '#ff9f68'); y += 10;
    rect(ctx, W - 148, H - 14, 146, 12, '#3a3560'); frame(ctx, W - 148, H - 14, 146, 12, '#8a80c0');
    drawText(ctx, Game.touch ? 'BAND & ITEMS' : 'TAB: BAND & ITEMS', W - 75, H - 11, '#fff', { align: 'center' });
    rect(ctx, W - 300, H - 14, 148, 12, '#241f38'); frame(ctx, W - 300, H - 14, 148, 12, '#6b5f9a');
    drawText(ctx, Game.touch ? 'SAVE & QUIT' : 'ESC: SAVE & QUIT', W - 226, H - 11, '#cfc9e6', { align: 'center' });
    if (Game.touch) drawText(ctx, 'DRAG TO SCROLL - TAP A GLOWING STOP', 4, H - 11, '#6b5f9a');
  }
}

// ---------- Band management ----------
class BandScene {
  constructor() { this.sel = 0; this.buildMenu(); }
  buildMenu() {
    const r = Game.run; const m = r.members[this.sel];
    const items = [];
    r.consumables.forEach((k, i) => {
      if (k === 'bread') items.push({ label: 'Use Bread Crumbs on ' + m.name, icon: 'bread', disabled: m.hunger === 0, onSelect: () => { m.hunger = Math.max(0, m.hunger - 1); r.consumables.splice(i, 1); Audio.ui('eat'); this.buildMenu(); } });
      if (k === 'bar') items.push({ label: 'Use Energy Bar on ' + m.name, icon: 'bar', disabled: m.stamina >= 100, onSelect: () => { m.stamina = Math.min(100, m.stamina + 40); r.consumables.splice(i, 1); Audio.ui('eat'); this.buildMenu(); } });
    });
    r.spareInstruments.forEach((s, i) => {
      items.push({ label: 'Give ' + INSTRUMENTS[s.kind].name + ' ' + '★'.repeat(s.quality) + ' to ' + m.name, icon: 'case', onSelect: () => { const old = { kind: m.instrument, quality: m.quality }; m.instrument = s.kind; m.quality = s.quality; r.spareInstruments.splice(i, 1, old); this.buildMenu(); } });
    });
    if (r.members.length > 1 && !m.leader) items.push({ label: 'Part ways with ' + m.name, icon: 'event', onSelect: () => { r.members.splice(this.sel, 1); this.sel = 0; this.buildMenu(); } });
    items.push({ label: 'Sound: ' + (Game.muted ? 'OFF' : 'ON'), icon: 'metronome', onSelect: () => { Game.muted = !Game.muted; Audio.setMuted(Game.muted); this.buildMenu(); } });
    items.push({ label: 'Back to map', onSelect: () => { r.save(); Game.setScene(new MapScene()); } });
    this.menu = new Menu(items);
  }

// ---------- Shop ----------
class ShopScene {
  constructor(node) {
    this.node = node; const r = Game.run;
    if (!node.stock) {
      const rng = r.rng; const pm = 1 + r.day * 0.12;
      const stock = [];
      const ik = rng.shuffle(INSTRUMENT_KEYS.filter(k => k !== 'tambourine')).slice(0, 2);
      for (const k of ik) { const q = rng.int(1, Math.min(3, 1 + r.day)); stock.push({ kind: 'instrument', key: k, quality: q, price: Math.round(INSTRUMENTS[k].price * (0.7 + q * 0.3) * pm) }); }
      const relics = rng.shuffle(RELIC_KEYS.filter(k => !r.relics.includes(k))).slice(0, 3);
      for (const k of relics) stock.push({ kind: 'relic', key: k, price: Math.round(ITEMS[k].price * pm) });
      for (const k of rng.shuffle(USE_KEYS).slice(0, 2)) stock.push({ kind: 'use', key: k, price: Math.round(ITEMS[k].price * pm) });
      if (rng.chance(0.45)) { const m = r.makeMember(); stock.push({ kind: 'recruit', member: m, price: 18 + r.day * 7 + m.skill * 2 }); }
      node.stock = stock;
    }
    this.mode = 'shop'; this.msg = 'Welcome! Everything is slightly overpriced. It\'s San Francisco.'; this.buildMenu();
  }
  buildMenu() {
    const r = Game.run; const items = [];
    for (const s of this.node.stock) {
      if (s.sold) continue;
      const afford = r.money >= s.price;
      if (s.kind === 'instrument') items.push({ label: INSTRUMENTS[s.key].name + ' ' + '★'.repeat(s.quality), right: fmtMoney(s.price), icon: 'case', disabled: !afford, stock: s, onSelect: () => this.pickMember(s) });
      else if (s.kind === 'recruit') items.push({ label: 'HIRE ' + s.member.name + ' the ' + SPECIES[s.member.species].name + ' (' + INSTRUMENTS[s.member.instrument].name + ', skill ' + s.member.skill + ')', right: fmtMoney(s.price), icon: 'openmic', disabled: !afford || r.members.length >= 6, stock: s, onSelect: () => { r.money -= s.price; s.sold = true; r.members.push(s.member); Audio.ui('cash'); this.msg = s.member.name + ' joins the band!'; this.buildMenu(); } });
      else items.push({ label: ITEMS[s.key].name, right: fmtMoney(s.price), icon: ITEMS[s.key].icon, disabled: !afford || (s.kind === 'use' && r.consumables.length >= 6), stock: s, onSelect: () => { r.money -= s.price; s.sold = true; if (s.kind === 'relic') r.addRelic(s.key); else r.consumables.push(s.key); Audio.ui('cash'); this.msg = 'Bought ' + ITEMS[s.key].name + '.'; this.buildMenu(); } });
    }
    items.push({ label: 'Leave the shop', onSelect: () => Game.afterNode() });
    this.menu = new Menu(items);
  }
  pickMember(s) {
    const r = Game.run; this.mode = 'member';
    this.sub = new Menu(r.members.map(m => ({ label: m.name + ' (' + INSTRUMENTS[m.instrument].name + ' ★'.repeat(m.quality) + ')', onSelect: () => {
      r.money -= s.price; s.sold = true; r.spareInstruments.push({ kind: m.instrument, quality: m.quality }); m.instrument = s.key; m.quality = s.quality; Audio.ui('cash');
      this.msg = m.name + ' now plays ' + INSTRUMENTS[s.key].name + '. Old instrument stored as a spare.'; this.mode = 'shop'; this.buildMenu();
    } })).concat([{ label: 'Cancel', onSelect: () => { this.mode = 'shop'; } }]));
  }
  update() { }
  key(code) {
    if (this.mode === 'member') { if (code === 'Escape') { this.mode = 'shop'; return; } this.sub.key(code); return; }
    if (code === 'Escape') { Game.afterNode(); return; }
    this.menu.key(code);
  }
  click(x, y) { (this.mode === 'member' ? this.sub : this.menu).click(x, y); }
  hover(x, y) { (this.mode === 'member' ? this.sub : this.menu).hover(x, y); }
  draw(ctx) {
    const r = Game.run;
    rect(ctx, 0, 0, W, H, '#1a1420');
    // shop interior
    rect(ctx, 0, 13, W, 110, '#2a1e2a'); rect(ctx, 0, 123, W, H, '#3a2a20');
    for (let x = 0; x < W; x += 24) rect(ctx, x, 123, 1, H, '#2a1a10');
    for (let i = 0; i < 12; i++) { const k = INSTRUMENT_KEYS[i % INSTRUMENT_KEYS.length]; const s = instrumentSprite(k); ctx.drawImage(s, 260 + (i % 6) * 34, 30 + Math.floor(i / 6) * 40); }
    rect(ctx, 250, 26, 220, 1, '#6a4a30'); rect(ctx, 250, 66, 220, 1, '#6a4a30'); rect(ctx, 250, 106, 220, 1, '#6a4a30');
    drawBug(ctx, 'weevil', 300, 100, { pose: 'stand', hat: 'top' });
    rect(ctx, 280, 118, 60, 14, '#5a3a20'); drawText(ctx, 'COUNTER', 310, 122, '#c0a080', { align: 'center' });
    drawText(ctx, 'WEEVIL\'S MUSIC EMPORIUM', 12, 18, '#ffe14d', { scale: 2 });
    panel(ctx, 8, 32, 236, 130);
    (this.mode === 'member' ? this.sub : this.menu).draw(ctx, 14, 38, 224, 10);
    // details

      else if (s.kind === 'recruit') { drawText(ctx, 'SESSION MUSICIAN', 14, 172, '#ffe680'); drawWrapped(ctx, 'A new band member. More members = more instruments to juggle, bigger backing bonus, and one more mouth to feed each night.', 14, 180, 110, '#e0dcf0'); drawBug(ctx, s.member.species, W - 40, 176, { pose: 'play', instrument: s.member.instrument }); }
      else { drawText(ctx, ITEMS[s.key].name.toUpperCase() + (s.kind === 'relic' ? ' (RELIC)' : ' (CONSUMABLE)'), 14, 172, '#ffe680'); drawWrapped(ctx, ITEMS[s.key].desc, 14, 180, 110, '#e0dcf0'); }

// ---------- Night / dinner ----------
class NightScene {
  constructor() {
    const r = Game.run; this.t = 0; this.phase = 'dinner'; this.log = [];
    const price = r.mealPrice(), n = r.members.length, total = price * n;
    const canFeed = Math.min(n, Math.floor(r.money / price));
    this.menu = new Menu([
      { label: 'Full meal for everyone', right: fmtMoney(total), icon: 'food', disabled: r.money < total, onSelect: () => { r.money -= total; r.members.forEach(m => { m.hunger = 0; m.stamina = Math.min(100, m.stamina + 65); }); Audio.ui('eat'); this.log.push('Burritos the size of a bug\'s head. Everyone is fed and happy.'); this.morning(); } },
      { label: 'Feed the hungriest ' + canFeed + ' member' + (canFeed === 1 ? '' : 's') + ', others go without', right: fmtMoney(price * canFeed), icon: 'bread', disabled: canFeed === 0 || canFeed === n, onSelect: () => {
        const sorted = r.members.slice().sort((a, b) => b.hunger - a.hunger || a.stamina - b.stamina);
        sorted.forEach((m, i) => { if (i < canFeed) { m.hunger = 0; m.stamina = Math.min(100, m.stamina + 65); } else { m.hunger++; m.stamina = Math.min(100, m.stamina + 25); } });
        r.money -= price * canFeed; Audio.ui('eat'); this.log.push(canFeed + ' ate. ' + sorted.slice(canFeed).map(m => m.name).join(', ') + ' went hungry.'); this.morning(); } },
      { label: 'Cheap snacks for all (hunger stays as it is)', right: fmtMoney(Math.ceil(price / 2) * n), icon: 'bar', disabled: r.money < Math.ceil(price / 2) * n, onSelect: () => { r.money -= Math.ceil(price / 2) * n; r.members.forEach(m => { m.stamina = Math.min(100, m.stamina + 40); }); Audio.ui('eat'); this.log.push('Vending machine chips. Nobody is full, nobody starves.'); this.morning(); } },
      { label: 'Skip dinner (everyone +1 hunger)', icon: 'event', onSelect: () => { r.members.forEach(m => { m.hunger++; m.stamina = Math.min(100, m.stamina + 25); }); Audio.ui('sad'); this.log.push('Stomachs growl in a minor key.'); this.morning(); } },
    ]);
  }
  morning() {
    const r = Game.run; this.phase = 'morning';

    for (const m of leaving) {
      if (m.leader) { this.gameOver = 'You collapsed from hunger on the sidewalk. The orchestra disbands.'; continue; }
      r.members.splice(r.members.indexOf(m), 1);
      this.log.push(m.name + ' the ' + SPECIES[m.species].name + ' left at dawn to find food elsewhere.');
    }
    if (!this.gameOver && r.members.some(m => m.hunger === 1)) this.log.push('Hungry bugs play with shaky hands (smaller timing windows).');

    if (!this.gameOver) this.log.push('A new day. ' + DAY_NAMES[Math.min(4, r.day)] + ' awaits.');

  }
  update(dt) { this.t += dt; }
  key(code) { this.menu.key(code); }
  click(x, y) { this.menu.click(x, y); }

    ctx.drawImage(propSprite('lamp'), 100, 150);
    r.members.forEach((m, i) => { drawBug(ctx, m.species, 130 + i * 36, 172 + Math.round(Math.sin(this.t * 2 + i) * 0.5), { pose: 'stand' }); if (this.phase === 'morning' && m.hunger === 0) circle(ctx, 146 + i * 36, 188, 3, '#e0c080'); });
    panel(ctx, 30, 20, W - 60, 120);
    if (this.phase === 'dinner') {
      drawText(ctx, 'NIGHTFALL - DAY ' + (r.day + 1), 38, 26, '#ffe14d', { scale: 2 });
      drawText(ctx, 'Meals cost ' + fmtMoney(r.mealPrice()) + ' per bug tonight. You have ' + fmtMoney(r.money) + '.', 38, 44, '#e0dcf0');
      drawText(ctx, 'A full meal resets hunger and restores 65 stamina. STARVING bugs (hunger 2) leave at dawn.', 38, 52, '#9a8fd0');
      this.menu.draw(ctx, 38, 66, W - 76, 12);
      const hungry = r.members.filter(m => m.hunger > 0);
      if (hungry.length) drawText(ctx, 'Already hungry: ' + hungry.map(m => m.name + (m.hunger >= 2 ? ' (STARVING)' : '')).join(', '), 38, 124, '#ff9f68');
    } else {
      drawText(ctx, 'MORNING', 38, 26, '#ffe14d', { scale: 2 });
      let y = 44; for (const l of this.log) y += drawWrapped(ctx, l, 38, y, 100, '#e0dcf0') * 7 + 2;
      this.menu.draw(ctx, 38, Math.max(y + 4, 118), W - 76, 12);
    }
    Game.drawRunHud(ctx);
  }
}

      const grad = ctx.createLinearGradient(0, 0, 0, gy); grad.addColorStop(0, '#2a1a4a'); grad.addColorStop(0.6, '#c05060'); grad.addColorStop(1, '#f0a060'); ctx.fillStyle = grad; ctx.fillRect(0, 0, W, gy);

      for (let x = 0; x < W; x++) { const cc = Math.abs(((x + 110) % 200) - 100) / 100; const y = 8 + Math.round(cc * cc * 50); rect(ctx, x, y, 1, 1, '#e05040'); if (x % 10 === 0) rect(ctx, x, y, 1, 60 - y, '#a03020'); }
      // fog
      for (let i = 0; i < 12; i++) { ctx.globalAlpha = 0.4; rect(ctx, r.int(-20, W), 40 + r.int(0, 30), r.int(30, 90), 6, '#e0e0f0'); } ctx.globalAlpha = 1;
      rect(ctx, 0, gy - 20, W, 20, '#5a5a6a'); rect(ctx, 0, gy - 20, W, 2, '#c03a2a');
      rect(ctx, 0, gy, W, h - gy, '#6a6a74'); for (let x = 0; x < W; x += 14) rect(ctx, x, gy, 1, h - gy, '#5a5a64');
