// ---------- A real drum kit drawn into the play area ----------
// Each lane's receptor IS a drum, so hitting a note means hitting that drum.
// Each drum is a cached pixel sprite at its final size, so the kit is always
// drawn 1:1 and never scales into a blurry or oversized mess.
// ---------- The kit ----------
// Every piece is its own pixel sprite, built at final size and drawn 1:1, with
// a real material on it: dented galvanised steel on the bucket, battered
// aluminium on the pot, wrapped ply on a proper shell, hammered brass on the
// cymbals. `surf` is where the playing surface sits inside the sprite and
// `grab` is how far from it a tap still counts, so the whole thing is one
// clickable object rather than a button with a picture on it.
const PIECE_GEO = {
  bucket: { w: 46, h: 56, surf: 10, grab: 25 },
  pot:    { w: 44, h: 38, surf: 9,  grab: 23 },
  crate:  { w: 50, h: 42, surf: 9,  grab: 25 },
  kick:   { w: 78, h: 62, surf: 11, grab: 36 },
  snare:  { w: 56, h: 40, surf: 9,  grab: 27 },
  tom:    { w: 48, h: 38, surf: 8,  grab: 24 },
  hat:    { w: 54, h: 32, surf: 13, grab: 26 },
  crash:  { w: 70, h: 22, surf: 11, grab: 33 },
  ride:   { w: 76, h: 22, surf: 11, grab: 36 },
  floor:  { w: 60, h: 54, surf: 10, grab: 29 },
  pan:    { w: 42, h: 28, surf: 8,  grab: 21 },
};
const KIT_SIZE = PIECE_GEO;   // kept under the old name for anything still asking

// A struck drumhead: cream mylar with a dented rim and a worn patch where the
// stick lands, plus a coat of arms of scratches.
function _head(P, cx, cy, rx, ry, lit, seed) {
  const OLD = '#1d1620';
  const hd = P.mask(); P.mEllipse(hd, cx, cy, rx, ry);
  P.fill(hd, lit ? '#fff8dc' : '#e4dcc8', { outline: OLD, shade: false });
  P.ditherTo(hd, lit ? '#ffefbc' : '#cfc5ae', (x, y) => (y - (cy - ry)) / (ry * 2));
  P.grain(hd, 0.05, seed);
  // the worn spot, just off centre, where a stick actually lands
  const wr = P.mask(); P.mEllipse(wr, cx + rx * 0.12, cy, rx * 0.34, ry * 0.42);
  P.paint(wr, () => lit ? '#fff2c8' : '#e4dbc6');
  P.scuff(hd, seed + 3, 5, 0.08);
  // counter-hoop around the edge
  const rim = P.mask(); P.mEllipse(rim, cx, cy, rx, ry);
  const in2 = P.mask(); P.mEllipse(in2, cx, cy, rx - 3, ry - 2);
  P.mSub(rim, in2); P.fill(rim, '#c2c6d2', { shade: false }); P.metal(rim, seed, 0.12);
  return hd;
}

function pieceSprite(piece, col, lit, chrome) {
  return cached('piece|' + piece + '|' + col + '|' + lit + '|' + !!chrome, () => {
    const OLD = '#1d1620', G = PIECE_GEO[piece] || PIECE_GEO.tom;
    const W2 = G.w, H2 = G.h, P = new Pix(W2, H2);
    const cx = W2 / 2, seed = hashStr(piece) & 255;
    const base = lit ? lighten(col, 0.2) : col;

    switch (piece) {
      // ---- a five-gallon paint bucket, upturned. Dented, paint-flecked.
      case 'bucket': {
        const top = G.surf, bot = H2 - 3;
        const body = P.mask();
        P.mPoly(body, [[cx - 16, top], [cx + 16, top], [cx + 20, bot], [cx - 20, bot]]);
        P.mEllipse(body, cx, bot, 20, 5);
        P.fill(body, base, { outline: OLD, shade: false });
        P.ditherTo(body, darken(base, 0.2), (x, y) => (y - top) / (bot - top) * 0.9);
        P.paint(body, (x) => x < cx - 11 ? lighten(base, 0.22) : x > cx + 12 ? darken(base, 0.2) : null);
        // moulded ribs around the body
        for (const ry2 of [top + 10, top + 20, top + 30, top + 40]) P.paint(body, (x, y) => y === Math.round(ry2) ? darken(base, 0.24) : y === Math.round(ry2) + 1 ? lighten(base, 0.16) : null);
        P.grain(body, 0.06, seed); P.scuff(body, seed, 9, 0.2);
        // splashes of dried paint down one side
        const sp = makeRng(seed + 9);
        for (let i = 0; i < 9; i++) { const x = Math.round(cx + sp.range(-17, 17)), y = Math.round(sp.range(top + 6, bot - 4)); const c2 = sp.pick(['#c8453a', '#3a6ec2', '#e8c23a']); for (let k = 0; k < sp.int(2, 5); k++) P.set(x, y + k, k ? darken(c2, 0.15) : c2); }
        // the base, which is now the top, is what you hit
        _head(P, cx, top, 16, G.surf - 2, lit, seed);
        // wire handle looped over the side
        for (let i = -1; i <= 1; i++) P.set(cx - 18 + i, top + 14, '#8a8a96');
        P.mLine(P.mask(), 0, 0, 0, 0);
        const hl = P.mask(); P.mLine(hl, cx - 19, top + 13, cx - 23, top + 25); P.mLine(hl, cx - 23, top + 25, cx - 20, top + 36);
        P.fill(hl, '#9a9aa6', { outline: OLD, shade: false });
        break;
      }
      // ---- a stock pot flipped over: dull aluminium, one big dent, two lugs
      case 'pot': {
        const top = G.surf, bot = H2 - 3;
        const body = P.mask();
        P.mPoly(body, [[cx - 18, top], [cx + 18, top], [cx + 15, bot], [cx - 15, bot]]);
        P.fill(body, base, { outline: OLD, shade: false });
        P.metal(body, seed, 0.14);
        P.ditherTo(body, darken(base, 0.24), (x, y) => (y - top) / (bot - top));
        P.paint(body, (x) => x < cx - 13 ? lighten(base, 0.26) : x > cx + 10 ? darken(base, 0.22) : null);
        // soot up the sides, because it has been on a stove
        P.ditherTo(body, '#3a3238', (x, y) => clamp((y - top - 11) / 20, 0, 1) * 0.5);
        P.scuff(body, seed, 10, 0.2);
        // a proper dent
        const dn = P.mask(); P.mEllipse(dn, cx + 9, top + 15, 5, 4); P.paint(dn, () => darken(base, 0.3));
        P.paint(dn, (x, y) => y === top + 11 ? lighten(base, 0.2) : null);
        // side lugs where the handles bolt on
        for (const lx of [cx - 18, cx + 16]) { const lg = P.mask(); P.mRect(lg, Math.round(lx), top + 8, 3, 5); P.fill(lg, '#7a7e88', { outline: OLD, shade: false }); }
        _head(P, cx, top, 18, G.surf - 2, lit, seed + 1);
        break;
      }
      // ---- a milk crate on its side: moulded plastic lattice
      case 'crate': {
        const top = G.surf, bot = H2 - 3;
        const body = P.mask(); P.mRound(body, Math.round(cx - 23), top, 46, bot - top, 3);
        P.fill(body, base, { outline: OLD, shade: false });
        P.ditherTo(body, darken(base, 0.22), (x, y) => (y - top) / (bot - top) * 0.8);
        // the lattice: square holes with a lip of shadow under each
        for (let gy = top + 5; gy < bot - 5; gy += 9) for (let gx = Math.round(cx - 19); gx < cx + 16; gx += 9) {
          for (let y = gy; y < gy + 5; y++) for (let x = gx; x < gx + 5; x++) P.set(x, y, y === gy ? darken(base, 0.42) : '#1f1a18');
          for (let x = gx; x < gx + 5; x++) P.set(x, gy + 5, lighten(base, 0.18));
        }
        P.grain(body, 0.05, seed); P.scuff(body, seed, 6, 0.14);

      }
      // ---- cymbals: hammered brass, lathed rings, a bell in the middle
      case 'crash': case 'ride': case 'hat': {
        const ry = G.surf - 2, rx = W2 / 2 - 2;
        const m = P.mask(); P.mEllipse(m, cx, G.surf, rx, ry);
        P.fill(m, chrome ? lighten(base, 0.14) : base, { outline: OLD, shade: false });
        // lathing: concentric grooves turned on a lathe
        for (let r = 8; r < rx; r += 5) P.paint(m, (x, y) => Math.abs(Math.abs(x - cx) - r) < 0.6 ? darken(base, 0.16) : Math.abs(Math.abs(x - cx) - r - 1) < 0.6 ? lighten(base, 0.2) : null);
        // hammer marks
        const hr = makeRng(seed + 5);
        for (let i = 0; i < Math.round(rx * ry * 0.55); i++) { const x = Math.round(cx + hr.range(-rx, rx)), y = Math.round(G.surf + hr.range(-ry, ry)); if (P.get(x, y)) P.set(x, y, hr.chance(0.5) ? lighten(base, 0.24) : darken(base, 0.18)); }
        P.paint(m, (x, y) => y > G.surf + 1 ? darken(base, 0.34) : null);
        P.paint(m, (x, y) => y === G.surf + ry || y === G.surf + ry - 1 ? darken(base, 0.5) : null);
        P.paint(m, (x, y) => y < G.surf - 1 && x > cx - rx * 0.6 && x < cx - rx * 0.1 ? lighten(base, 0.3) : null);
        // the bell
        const b = P.mask(); P.mEllipse(b, cx, G.surf - 1, 6, 2.6);
        P.fill(b, lighten(base, 0.26), { outline: OLD, shade: false });
        P.set(Math.round(cx), Math.round(G.surf - 1), '#6a5a2a');
        if (piece === 'hat') {
          // the bottom cymbal peeking out underneath
          const b2 = P.mask(); P.mEllipse(b2, cx, G.surf + 7, rx - 3, ry - 1);
          P.fill(b2, darken(base, 0.24), { outline: OLD, shade: false });
          P.metal(b2, seed, 0.1);
        }
        break;
      }
      // ---- proper shells: wrapped ply, chrome hoops, lugs, tension rods
      default: {
        const isKick = piece === 'kick', isFloor = piece === 'floor';
        const rx = W2 / 2 - 2, ry = G.surf - 1;
        const headY = G.surf, depth = H2 - headY - 4;
        const sh = P.mask();
        P.mRect(sh, Math.round(cx - rx), headY, Math.round(rx * 2), depth);
        P.mEllipse(sh, cx, headY + depth, rx, ry * 0.7);
        P.fill(sh, base, { outline: OLD, shade: false });
        // a lacquered barrel: light down the left, dark to the right
        P.ditherTo(sh, lighten(base, 0.22), (x) => clamp(1 - (x - (cx - rx)) / (rx * 0.55), 0, 1) * 0.75);
        P.ditherTo(sh, darken(base, 0.32), (x) => clamp((x - cx * 1.0) / (rx * 0.85), 0, 1) * 0.95);
        if (chrome) P.metal(sh, seed, 0.16); else P.wood(sh, seed, 0.07);
        P.grain(sh, 0.04, seed);
        P.scuff(sh, seed, isKick ? 8 : 5, 0.14);
        // hoops top and bottom
        const hoop = P.mask();
        P.mRect(hoop, Math.round(cx - rx), headY - 1, Math.round(rx * 2), 3);
        P.mRect(hoop, Math.round(cx - rx), headY + depth - 4, Math.round(rx * 2), 3);
        P.fill(hoop, chrome ? '#dfe4ee' : '#d9c37a', { outline: OLD, shade: false });
        P.metal(hoop, seed + 1, 0.18);
        // lugs, each with a tension rod above and below
        const lugs = isKick ? 5 : 3;
        for (let i = 0; i < lugs; i++) {
          const lx = Math.round(cx - rx + 5 + i * ((rx * 2 - 13) / (lugs - 1)));
          const lg = P.mask(); P.mRound(lg, lx, headY + Math.round(depth * 0.22), 3, Math.round(depth * 0.56), 1);
          P.fill(lg, '#8f94a4', { outline: OLD, shade: false }); P.metal(lg, seed + i, 0.22);
          P.set(lx + 1, headY + 3, '#d6dae6'); P.set(lx + 1, headY + depth - 6, '#d6dae6');
        }
        // a strip of badge on the kick
        if (isKick) { const bd = P.mask(); P.mRound(bd, Math.round(cx - 10), headY + Math.round(depth * 0.45), 20, 10, 2); P.fill(bd, '#2a2230', { outline: OLD, shade: false }); P.paint(bd, (x, y) => (x + y) % 3 === 0 ? '#c8a94a' : null); }
        if (isFloor) for (const lx of [cx - rx - 1, cx + rx - 1]) { const lg = P.mask(); P.mRect(lg, Math.round(lx), headY + 4, 2, depth + 2); P.fill(lg, '#c0c4d0', { outline: OLD, shade: false }); }
        _head(P, cx, headY, rx, ry, lit, seed);
        // the beater patch on a kick head
        if (isKick) { const pd = P.mask(); P.mEllipse(pd, cx, headY + 1, 9, 3); P.fill(pd, '#2e2a36', { shade: false }); P.grain(pd, 0.1, seed); }
        // snares, stretched under the shell
        if (piece === 'snare') for (let i = 0; i < 8; i++) P.set(Math.round(cx - 11 + i * 3), headY + depth - 1, '#d8dce6');
        break;
      }
    }
    return P.toCanvas();
  });
}

// Lay the kit out the way a drummer sees it: the low pieces in front, the
// cymbals up and out to the sides. Returns a hit target per piece so a tap
// lands on the drum itself and there is no button anywhere.
function kitLayout(pieces, cx, baseY, width) {
  const n = pieces.length;
  // Where each piece stands, as a fraction of the half-spread, and how high it
  // rides. Laid out the way a kit actually is: kick in front on the floor,
  // snare to the left under your hand, tom mounted above, cymbals up and out.
  const SPOT = {
    kick:  { x:  0.00, y:  16, z: 0 }, bucket: { x: -0.30, y: 14, z: 1 },
    pot:   { x:  0.34, y:  -4, z: 1 }, crate:  { x:  0.02, y: 14, z: 0 },
    snare: { x: -0.46, y:  -2, z: 1 }, tom:    { x:  0.31, y: -26, z: 2 },
    floor: { x:  0.62, y:   8, z: 1 }, hat:    { x: -0.94, y: -34, z: 3 },
    crash: { x:  0.93, y: -44, z: 3 }, ride:   { x:  0.95, y: -32, z: 3 },
    pan:   { x: -0.66, y: -14, z: 2 },
  };
  const spread = clamp(width * 0.28, 120, 178);
  const out = pieces.map((p, i) => {
    const G = PIECE_GEO[p] || PIECE_GEO.tom;
    const s = SPOT[p] || { x: (i / Math.max(1, n - 1) - 0.5) * 1.6, y: 0, z: 1 };
    // Two or three pieces of junk get fanned evenly instead: a bucket and a
    // pot standing in a real kit's footprint would just sit far apart.
    const fx = n <= 3 ? (n === 1 ? 0 : (i / (n - 1) - 0.5) * 1.15) : s.x;
    const fy = n <= 3 ? (i % 2 ? -6 : 10) : s.y;
    return { piece: p, i, G, x: Math.round(cx + fx * spread), y: Math.round(baseY + fy), z: s.z };
  });
  // Nudge anything that would sit on top of its neighbour.
  for (let pass = 0; pass < 3; pass++) {
    for (let i = 0; i < out.length; i++) for (let j = i + 1; j < out.length; j++) {
      const a = out[i], b = out[j];
      if (Math.abs(a.y - b.y) > 26) continue;
      const need = (a.G.w + b.G.w) / 2 - 8, gap = Math.abs(a.x - b.x);
      if (gap >= need) continue;
      const push = Math.ceil((need - gap) / 2), dir = a.x <= b.x ? -1 : 1;
      a.x += push * dir; b.x -= push * dir;
    }
  }
  out.sort((a, b) => b.z - a.z || a.y - b.y);   // far pieces drawn first
  return out;
}
// Is (px,py) on this piece's playing surface?
function kitHit(spot, px2, py) {
  const dx = (px2 - spot.x) / spot.G.grab, dy = (py - spot.y) / (spot.G.grab * 0.62);
  return dx * dx + dy * dy <= 1;
}
// Draw the kit. `R` supplies flashes and receptors; returns the layout so the
// scene can route pointer taps to the right drum.
function drawDrumKit(ctx, A, R, opts = {}) {
  const pieces = opts.pieces || ['kick', 'snare', 'hat', 'tom', 'crash'];
  const cx = opts.cx != null ? opts.cx : A.x + A.w / 2;
  const baseY = opts.baseY != null ? opts.baseY : A.y + A.h - 70;
  const spots = kitLayout(pieces, cx, baseY, opts.width || A.w);
  const chrome = !!opts.chrome;
  // What the kit stands on says as much as the kit does: a busker on a bucket
  // works off flattened cardboard, a working band gets a proper rug.
  const junk = !!opts.junk;
  const half = Math.max(110, Math.round(Math.max(...spots.map(s => Math.abs(s.x - cx) + s.G.w / 2)) + 22));
  const matTop = baseY + 16, matBot = baseY + (junk ? 46 : 60);
  for (let y = matTop; y < matBot; y++) {
    const k = (y - matTop) / (matBot - matTop);
    const hwid = Math.round(half * (0.84 + k * 0.24));
    for (let x = cx - hwid; x < cx + hwid; x += 1) {
      const w2 = ((x * 7 + y * 13) >>> 0) % 11;
      if (junk) rect(ctx, x, y, 1, 1, k > 0.88 ? '#6a4a2c' : (w2 < 2 ? '#a8814e' : w2 > 8 ? '#957141' : '#9c7745'));
      else rect(ctx, x, y, 1, 1, k > 0.9 ? '#2a131f' : (Math.floor(y / 6) % 2 ? (w2 < 3 ? '#432030' : '#3a1c2b') : (w2 > 8 ? '#4c2537' : '#442131')));
    }
  }
  if (junk) {
    // creases and a torn corner, so it reads as a broken-down box
    for (const fx of [-0.42, 0.1, 0.55]) { const x = Math.round(cx + half * fx); rect(ctx, x, matTop + 2, 1, matBot - matTop - 4, '#7d5c34'); }
    rect(ctx, cx - half, matTop, half * 2, 1, '#b58c55');
    for (let x = cx - Math.round(half * 0.9); x < cx + half * 0.9; x += 5) rect(ctx, x, matBot, 3, 1, '#5e4126');
  } else {
    for (let x = cx - Math.round(half * 1.08); x < cx + half * 1.08; x += 3) rect(ctx, x, matBot, 2, 3, '#6a3550');
  }
  // each piece, with its stand
  for (const sp of spots) {
    const flash = R.flashes[sp.i] || 0, lit = flash > 0.02;
    const col = PIECE_COLORS[sp.piece] || '#c2c8d6';
    const isCym = sp.piece === 'crash' || sp.piece === 'ride' || sp.piece === 'hat';
    const c = pieceSprite(sp.piece, col, lit, chrome);
    const wob = lit ? Math.round(Math.sin(R.now * 44) * (isCym ? 2 : 0)) : 0;
    const squash = lit && !isCym ? Math.round(flash * 3) : 0;
    // stands: a tube down to the rug with a tripod foot
    if (isCym || sp.piece === 'snare' || sp.piece === 'tom' || sp.piece === 'pot') {
      const legTop = sp.y + sp.G.surf + (isCym ? 2 : sp.G.h - sp.G.surf - 2);
      const legBot = matTop + 10;
      if (legBot > legTop) {
        rect(ctx, sp.x - 1, legTop, 3, legBot - legTop, '#6e7280');
        rect(ctx, sp.x - 1, legTop, 1, legBot - legTop, '#a2a6b4');
        for (const d of [-1, 1]) line(ctx, sp.x, legBot - 2, sp.x + d * 11, legBot + 8, '#5e626e');
        line(ctx, sp.x, legBot - 2, sp.x, legBot + 9, '#5e626e');
      }
    }
    ctx.drawImage(c, Math.round(sp.x - sp.G.w / 2), Math.round(sp.y - sp.G.surf + squash + wob));
    // the receptor is the playing surface itself
    R.receptors[sp.i] = { x: sp.x, y: sp.y + squash };
    sp.hx = sp.x; sp.hy = sp.y;
    if (lit) { ctx.globalAlpha = flash * 0.75; ellipsePx(ctx, sp.x, sp.y + squash, sp.G.grab * 0.8, sp.G.grab * 0.36, lighten(col, 0.4)); ctx.globalAlpha = 1; }
  }
  // A spare stick lying on the mat, because you only ever have the one pair.
  const sx = cx - half + 14, sy = matBot - 6;
  for (let i = 0; i < 22; i++) { const c2 = i > 17 ? '#f0e3c4' : i < 3 ? '#a8845a' : '#d9c191'; rect(ctx, sx + i, sy - Math.round(i * 0.12), 1, 2, c2); }
  rect(ctx, sx, sy + 2, 22, 1, 'rgba(0,0,0,0.25)');
  return spots;
}

// ---------- SHEET MUSIC ----------
// For the players who read: a real stave on real paper, scrolling right to
// left past a playhead. No highway, no perspective, no falling gems.
const CLEF_G = [
  '...##...', '..#..#..', '..#..#..', '..#.##..', '.###....', '#..#....',
  '#..#....', '.#.#....', '..###...', '...#....', '...#....', '.#.#....',
  '..#.....',
];
function staveSprite(w, h, seed) {
  return cached('stave|' + w + '|' + h + '|' + seed, () => {
    const P = new Pix(w, h);
    // aged paper with a little fibre and a couple of foxing spots
    const m = P.mask(); P.mRect(m, 0, 0, w, h);
    P.fill(m, '#efe3c2', { shade: false });
    P.ditherTo(m, '#e2d3ad', (x, y) => clamp((y / h) * 0.8 + 0.1, 0, 1) * 0.5);
    P.grain(m, 0.035, seed);
    const r = makeRng(hashStr('paper' + seed));
    for (let i = 0; i < 7; i++) { const sx = r.int(0, w - 4), sy = r.int(0, h - 4); const sp = P.mask(); P.mEllipse(sp, sx, sy, r.range(1, 3), r.range(1, 2.4)); P.paint(sp, () => '#ddc9a0'); }
    // a soft shadow down each long edge, like a page lifting
    P.paint(m, (x, y) => y < 2 ? '#f6ecd2' : y > h - 3 ? '#d4c299' : null);
    return P.toCanvas();
  });
}
// Draw the five-line stave and return the geometry the notes need.
function drawStave(ctx, x, y, w, h, opts = {}) {
  const paper = staveSprite(Math.round(w), Math.round(h), opts.seed || 1);
  ctx.drawImage(paper, Math.round(x), Math.round(y));
  rect(ctx, x, y, w, 1, '#c3ae84'); rect(ctx, x, y + h - 1, w, 1, '#b09b74');
  // Five lines, spaced so the whole stave sits in the middle half of the page
  // and there is room above and below for ledger lines.
  const step = clamp(Math.round(h * 0.062), 5, 10);     // one step = half a space
  const midY = Math.round(y + h * 0.5);
  const lines = [];
  for (let i = -2; i <= 2; i++) { const ly = midY + i * step * 2; lines.push(ly); rect(ctx, x + 4, ly, w - 8, 1, '#4a4038'); }
  // clef, drawn as pixels rather than a glyph, scaled to the stave
  const cs = Math.max(1, Math.round(step * 2 / 3.2));
  const cx0 = Math.round(x + 28), cy0 = Math.round(midY - CLEF_G.length * cs / 2);
  CLEF_G.forEach((row, ry) => { for (let rx = 0; rx < row.length; rx++) if (row[rx] === '#') rect(ctx, cx0 + rx * cs, cy0 + ry * cs, cs, cs, '#33291f'); });
  // time signature
  const tsx = cx0 + 8 * cs + 6;
  drawText(ctx, '4', tsx, midY - step * 2 - 2, '#33291f', { scale: 2 });
  drawText(ctx, '4', tsx, midY + 2, '#33291f', { scale: 2 });
  return { step, midY, lines, top: lines[0], bot: lines[4], left: x, right: x + w, padLeft: tsx + 18 };
}
// Where on the stave does this note sit? Lane 0 is the bottom line.
// Where on the stave does this note sit? Lane 0 sits low, the top lane high,
// spread over the stave plus a ledger line either side.
function stavePos(S, lane, lanes) {
  const spread = Math.max(1, lanes - 1);
  const steps = Math.round((lane / spread) * 10) - 5;   // -5..+5 half-spaces
  return Math.round(S.midY - steps * S.step);
}
// One notehead with its stem, plus ledger lines when it runs off the stave.
function drawNotehead(ctx, S, x, ny, col, opts = {}) {
  x = Math.round(x); ny = Math.round(ny);
  const filled = opts.hold !== true;
  // ledger lines above and below the stave
  for (let ly = S.top - S.step * 2; ly >= ny - 1; ly -= S.step * 2) rect(ctx, x - 7, ly, 15, 1, '#4a4038');
  for (let ly = S.bot + S.step * 2; ly <= ny + 1; ly += S.step * 2) rect(ctx, x - 7, ly, 15, 1, '#4a4038');
  // the head, tipped the way a written note is
  const dark = opts.judged ? '#8a8078' : '#2a2118';
  ellipsePx(ctx, x, ny, 5, 3.4, dark);
  ellipsePx(ctx, x, ny, 4, 2.6, filled ? col : '#f2e8cc');
  if (filled) ellipsePx(ctx, x - 1, ny - 1, 2, 1.2, lighten(col, 0.35));
  // stem: up if the note sits low, down if it sits high, like real notation
  const up = ny > S.midY;
  const sx = up ? x + 4 : x - 5, sy = up ? ny - 3 : ny + 3, len = S.step * 7;
  rect(ctx, sx, up ? sy - len : sy, 1, len, dark);
  if (opts.flag) { const fy = up ? sy - len : sy + len - 5; for (let i = 0; i < 5; i++) rect(ctx, sx + (up ? 1 : 1), fy + (up ? i : -i), Math.max(1, 4 - Math.floor(i / 2)), 1, dark); }
  if (opts.star) { drawText(ctx, '★', x, ny - S.step * 2 - 6, '#d9a520', { align: 'center', outline: '#f2e8cc' }); }
}

// ===== js/art/playable.js =====
// ---------- Playable instruments: you touch the note, not a button ----------
// Every surface here answers the same two questions: draw yourself, and tell me
// which note is under this finger. Nothing has a letter on it, because a real
// instrument does not either — you find the note by where it sits.
'use strict';

const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const IS_BLACK = [0, 1, 0, 1, 0, 0, 1, 0, 1, 0, 1, 0];
const noteName = (m) => NOTE_NAMES[((m % 12) + 12) % 12];
const octaveOf = (m) => Math.floor(m / 12) - 1;

// ---------- PIANO ----------
// A real keyboard: white keys with the black ones sitting between them in the
// right places, so the shape of the octave is the thing you learn to read.
class PianoSurface {
  // lo/hi are MIDI notes; the keyboard covers whole octaves around them
  constructor(lo, hi) {
    this.lo = Math.max(21, lo - ((lo % 12) === 0 ? 0 : (lo % 12)));    // start on a C
    this.hi = Math.min(108, hi + (11 - (hi % 12)));                    // end on a B
    this.whites = []; this.blacks = [];
    for (let m = this.lo; m <= this.hi; m++) (IS_BLACK[m % 12] ? this.blacks : this.whites).push(m);
  }
  layout(x, y, w, h) {
    const nW = this.whites.length;
    const kw = Math.max(9, Math.floor(w / nW)), used = kw * nW;
    const x0 = Math.round(x + (w - used) / 2);
    this.geo = { x: x0, y: Math.round(y), w: used, h: Math.round(h), kw, bw: Math.max(5, Math.round(kw * 0.62)), bh: Math.round(h * 0.6) };
    this.slots = {};
    this.whites.forEach((m, i) => { this.slots[m] = { m, x: x0 + i * kw, y: this.geo.y, w: kw, h: this.geo.h, black: false, cx: x0 + i * kw + kw / 2 }; });
    // a black key hangs on the seam between the two whites it sits between
    for (const m of this.blacks) {
      const wi = this.whites.filter(w2 => w2 < m).length;          // whites to its left
      const bx = x0 + wi * kw - Math.round(this.geo.bw / 2);
      this.slots[m] = { m, x: bx, y: this.geo.y, w: this.geo.bw, h: this.geo.bh, black: true, cx: bx + this.geo.bw / 2 };
    }
    return this.geo;
  }
  // Black keys sit on top, so they get first refusal on a tap.
  noteAt(px2, py) {
    const g = this.geo; if (!g) return null;
    if (py < g.y || py > g.y + g.h) return null;
    for (const m of this.blacks) { const s = this.slots[m]; if (px2 >= s.x && px2 < s.x + s.w && py < s.y + s.h) return m; }
    for (const m of this.whites) { const s = this.slots[m]; if (px2 >= s.x && px2 < s.x + s.w) return m; }
    return null;
  }
  slotOf(m) { return this.slots ? this.slots[m] : null; }
  // lit: {midi: strength}. ghost: notes to outline as a hint, without filling.
  draw(ctx, opts = {}) {
    const g = this.geo; if (!g) return;
    const lit = opts.lit || {}, ghost = opts.ghost || {}, held = opts.held || {};
    // the case the keys are set into
    rect(ctx, g.x - 6, g.y - 9, g.w + 12, g.h + 15, '#2a2029');
    rect(ctx, g.x - 6, g.y - 9, g.w + 12, 2, '#4a3c48');
    rect(ctx, g.x - 5, g.y - 7, g.w + 10, 5, '#16121a');
    rect(ctx, g.x - 5, g.y - 3, g.w + 10, 1, '#5c4a58');
    for (const m of this.whites) {
      const s = this.slots[m], on = lit[m] || 0, hd = held[m], down = on > 0 || hd;
      const dy = down ? 2 : 0;
      rect(ctx, s.x, s.y + dy, s.w - 1, s.h, '#1a1418');
      const face = hd ? '#ffe9a8' : on > 0 ? mixColor('#f6f2e6', '#ffd24a', clamp(on, 0, 1)) : '#f6f2e6';
      rect(ctx, s.x + 1, s.y + 1 + dy, s.w - 3, s.h - 2, face);
      // ivory: warm at the top, worn grey along the front lip
      rect(ctx, s.x + 1, s.y + 1 + dy, s.w - 3, 2, lighten(face, 0.08));
      rect(ctx, s.x + 1, s.y + s.h - 4 + dy, s.w - 3, 3, darken(face, 0.1));
      rect(ctx, s.x + s.w - 3, s.y + 1 + dy, 1, s.h - 2, darken(face, 0.16));
      if (ghost[m]) { frame(ctx, s.x + 2, s.y + s.h - 16 + dy, s.w - 5, 13, '#4d86c6'); rect(ctx, s.x + 3, s.y + s.h - 15 + dy, s.w - 7, 11, 'rgba(77,134,198,0.3)'); }
      // C is marked, the way a beginner marks their own keyboard
      if (m % 12 === 0) drawText(ctx, 'C' + octaveOf(m), s.cx, s.y + s.h - 11 + dy, '#b0a694', { align: 'center', font: 'small' });
    }
    for (const m of this.blacks) {
      const s = this.slots[m], on = lit[m] || 0, hd = held[m], down = on > 0 || hd;
      const dy = down ? 2 : 0;
      rect(ctx, s.x, s.y + dy, s.w, s.h, '#0e0b12');
      const face = hd ? '#e0b040' : on > 0 ? mixColor('#332c3a', '#ffd24a', clamp(on, 0, 1)) : '#332c3a';
      rect(ctx, s.x + 1, s.y + dy, s.w - 2, s.h - 3, face);
      rect(ctx, s.x + 1, s.y + dy, s.w - 2, 1, lighten(face, 0.22));
      rect(ctx, s.x + 1, s.y + s.h - 5 + dy, s.w - 2, 2, darken(face, 0.3));
      if (ghost[m]) frame(ctx, s.x, s.y + s.h - 14 + dy, s.w, 12, '#4d86c6');
    }
  }
}

// ---------- GUITAR ----------
// A fretboard laid flat: six strings, five frets. You pick the spot, which
// means you have to know where a note lives on the neck.
const GTR_TUNING = [40, 45, 50, 55, 59, 64];     // E A D G B e, low string first
class FretSurface {
  constructor(strings, frets) { this.S = strings || GTR_TUNING.slice(); this.F = frets || 5; }
  midiAt(str, fret) { return this.S[str] + fret; }
  layout(x, y, w, h) {
    const nutW = 12, fw = Math.floor((w - nutW) / this.F), sh = Math.floor(h / this.S.length);
    this.geo = { x: Math.round(x), y: Math.round(y), w: nutW + fw * this.F, h: sh * this.S.length, fw, sh, nutW };
    return this.geo;
  }
  // Where a stopped note sits: the middle of the fret, on its string.
  spot(str, fret) {
    const g = this.geo; if (!g) return null;
    const sy = g.y + g.sh * (this.S.length - 1 - str) + g.sh / 2;
    const sx = fret === 0 ? g.x + g.nutW / 2 : g.x + g.nutW + (fret - 1) * g.fw + g.fw / 2;
    return { x: Math.round(sx), y: Math.round(sy), str, fret, m: this.midiAt(str, fret) };
  }
  // Every place on the neck that sounds this pitch, nearest the nut first.
  spotsFor(midi) {
    const out = [];
    for (let s = 0; s < this.S.length; s++) { const f = midi - this.S[s]; if (f >= 0 && f <= this.F) out.push(this.spot(s, f)); }
    return out.sort((a, b) => a.fret - b.fret);
  }
  noteAt(px2, py) {
    const g = this.geo; if (!g) return null;
    if (px2 < g.x || px2 > g.x + g.w || py < g.y || py > g.y + g.h) return null;
    const row = clamp(Math.floor((py - g.y) / g.sh), 0, this.S.length - 1);
    const str = this.S.length - 1 - row;
    const fret = px2 < g.x + g.nutW ? 0 : clamp(Math.floor((px2 - g.x - g.nutW) / g.fw) + 1, 1, this.F);
    return { m: this.midiAt(str, fret), str, fret };
  }
  draw(ctx, opts = {}) {
    const g = this.geo; if (!g) return;
    const lit = opts.lit || {}, ghost = opts.ghost || {};
    const n = this.S.length;
    // the neck: bound edges, a rosewood board, and the body butting in at the
    // end, so what you are looking at is a guitar and not a brown rectangle
    rect(ctx, g.x - 5, g.y - 7, g.w + 10, g.h + 14, '#2a1a12');
    rect(ctx, g.x - 4, g.y - 6, g.w + 8, 4, '#e8dcc0');        // binding, top
    rect(ctx, g.x - 4, g.y + g.h + 2, g.w + 8, 4, '#cdbf9e');  // binding, bottom
    rect(ctx, g.x - 4, g.y - 6, g.w + 8, 1, '#fff6e2');
    const board = cached('fbd2|' + g.w + '|' + g.h, () => {
      const P = new Pix(g.w, g.h), m = P.mask(); P.mRect(m, 0, 0, g.w, g.h);
      P.fill(m, '#5c3b2c', { shade: false });
      P.wood(m, 7, 0.12); P.grain(m, 0.06, 3);
      P.ditherTo(m, '#472c21', (x, y) => clamp(Math.abs(y - g.h / 2) / (g.h / 2), 0, 1) * 0.6);
      return P.toCanvas();
    });
    ctx.drawImage(board, g.x, g.y);
    // the nut, then fretwire with a shadow under each one
    for (let f = 1; f <= this.F; f++) {
      const fx = g.x + g.nutW + f * g.fw;
      rect(ctx, fx - 2, g.y, 1, g.h, 'rgba(0,0,0,0.35)');
      rect(ctx, fx - 1, g.y, 2, g.h, '#b9bcc8'); rect(ctx, fx - 1, g.y, 1, g.h, '#eef2fa');
    }
    rect(ctx, g.x + g.nutW - 4, g.y, 4, g.h, '#efe6ce');
    rect(ctx, g.x + g.nutW - 4, g.y, 1, g.h, '#fffaea');
    rect(ctx, g.x + g.nutW, g.y, 1, g.h, 'rgba(0,0,0,0.4)');
    // position dots where a guitar actually has them, doubled at the twelfth
    for (const f of [3, 5, 7, 9, 12]) {
      if (f > this.F) continue;
      const sp = this.spot(0, f), cy = g.y + g.h / 2;
      const ys = f === 12 ? [cy - g.sh, cy + g.sh] : [cy];
      for (const yy of ys) { ellipsePx(ctx, sp.x, yy, 3, 3, '#b8ab8a'); ellipsePx(ctx, sp.x, yy - 1, 3, 2, '#eee4c6'); }
    }
    // strings: thick and bronze at the bottom, thin and bright at the top
    for (let s2 = 0; s2 < n; s2++) {
      const row = n - 1 - s2, sy = Math.round(g.y + g.sh * row + g.sh / 2);
      const th = s2 < 2 ? 3 : s2 < 4 ? 2 : 1;
      const col = s2 < 3 ? '#cdb079' : '#e2e2ea';
      rect(ctx, g.x, sy + th, g.w, 1, 'rgba(0,0,0,0.4)');
      rect(ctx, g.x, sy, g.w, th, col);
      rect(ctx, g.x, sy, g.w, 1, lighten(col, 0.3));
      // the winding on a wound string, as a fine stripe
      if (s2 < 3) for (let x = g.x; x < g.x + g.w; x += 3) rect(ctx, x, sy + th - 1, 1, 1, darken(col, 0.22));
    }
    // a hint ring, then the finger that lands on it
    for (const key in ghost) { const sp = ghost[key]; if (!sp) continue; ellipseRingPx(ctx, sp.x, sp.y, 9, 8, '#4d86c6'); ellipseRingPx(ctx, sp.x, sp.y, 8, 7, '#2f5a8a'); }
    for (const key in lit) {
      const l = lit[key]; if (!l || !l.sp) continue;
      const k = clamp(l.k, 0, 1);
      ellipsePx(ctx, l.sp.x, l.sp.y, 10, 9, withAlpha('#ffd24a', 0.3 * k));
      ellipsePx(ctx, l.sp.x, l.sp.y, 7, 6, '#1d1620');
      ellipsePx(ctx, l.sp.x, l.sp.y, 6, 5, '#ffe9a8');
      ellipsePx(ctx, l.sp.x - 1, l.sp.y - 1, 3, 2, '#fff8e0');
    }
    // string names down the nut, the one label a real neck does carry
    const NAMES = ['E', 'A', 'D', 'G', 'B', 'e'];
    for (let s2 = 0; s2 < n; s2++) {
      const row = n - 1 - s2, sy = Math.round(g.y + g.sh * row + g.sh / 2);
      drawText(ctx, NAMES[s2] || noteName(this.S[s2]), g.x - 7, sy - 2, '#8a7f6a', { align: 'right', font: 'small' });
    }
  }
}

// Build the surface an instrument is played on, sized to the range of the tune
// so every note in it is reachable without scrolling the neck or the keyboard.
function makeSurface(instr, song) {
  const ns = ((song && song.melody) || []).filter(n => n[0] > 0).map(n => n[0]);
  const lo = ns.length ? Math.min(...ns) : 60, hi = ns.length ? Math.max(...ns) : 72;
  if (instr.view === 'fret') {
    const tuning = instr.tuning || GTR_TUNING;
    const frets = instr.frets || 5;
    // slide the whole neck so the tune sits on it, the way a capo would
    const open = tuning[0], top = tuning[tuning.length - 1] + frets;
    let shift = 0;
    if (lo < open) shift = -Math.ceil((open - lo) / 12) * 12;
    else if (hi > top) shift = Math.ceil((hi - top) / 12) * 12;
    return new FretSurface(tuning.map(t => t + shift), frets);
  }
  const octs = instr.octaves || 2;
  // centre the keyboard on the tune, then widen until the tune fits inside it
  const mid = Math.round((lo + hi) / 2);
  let start = clamp(Math.floor((mid - octs * 6) / 12) * 12, 36, 84);
  let end = start + octs * 12 - 1;
  while (lo < start && start > 24) start -= 12;
  while (hi > end && end < 103) end += 12;
  return new PianoSurface(start, end);
}
// How far a tune has to move to sit on a given surface at all.
function fitToSurface(surface, notes) {
  if (!notes.length) return 0;
  const lo = Math.min(...notes), hi = Math.max(...notes);
  const sLo = surface.lo != null ? surface.lo : surface.S[0];
  const sHi = surface.hi != null ? surface.hi : surface.S[surface.S.length - 1] + surface.F;
  let shift = 0;
  while (lo + shift < sLo) shift += 12;
  while (hi + shift > sHi) shift -= 12;
  return shift;
}

// ===== js/art/sleeves.js =====
// ---------- Record sleeves ----------
// Original cover art, one per tune, drawn in the *design language* of a period
// rather than copying anybody's actual sleeve: a hard-bop two-tone block, a
// prog gatefold landscape, a photocopied punk zine, a chrome metal sleeve, a
// black-metal forest, a folk porch photo, a psych poster, a plain classical
// box. Every one of them has a bug on it.
'use strict';

const SLEEVE_PX = 88;
// Band names built from bug vocabulary. Original, and daft on purpose.
const BAND_A = ['THE', 'DEAD', 'ROYAL', 'SIX', 'LATE', 'HOLY', 'YOUNG', 'ELECTRIC', 'SLOW', 'BITTER', 'GOLDEN', 'CRUDE'];
const BAND_B = ['MANDIBLE', 'CARAPACE', 'LARVA', 'THORAX', 'ANTENNA', 'MOLT', 'CHITIN', 'GRUB', 'HIVE', 'SPIRACLE', 'PUPA', 'WEEVIL', 'MOTH', 'BEETLE', 'APHID'];
const BAND_C = ['S', ' COLLECTIVE', ' ORCHESTRA', ' FIVE', ' QUARTET', ' UNION', ' SOCIETY', ' BROTHERS', '', '', ''];
const LABELS = ['BUZZ REC.', 'HIVE SOUND', 'NECTAR', 'SIX LEG', 'CHITIN LP', 'MOLT RECORDS', 'ANTHILL', 'GRUBWAX'];
function bandName(key) {
  const r = makeRng(hashStr('band' + key));
  const a = r.chance(0.45) ? r.pick(BAND_A) + ' ' : '';
  return (a + r.pick(BAND_B) + r.pick(BAND_C)).trim();
}
// Which design era a tune gets. Stable per tune, steered by its genre so a
// waltz does not end up looking like a thrash record unless the dice say so.
const STYLE_BY_GENRE = {
  rock: ['shred', 'bm', 'punk', 'prog'],
  jazz: ['bop', 'bop', 'soul'],
  funk: ['soul', 'disco', 'psych'],
  ballad: ['classical', 'folk', 'prog'],
  folk: ['folk', 'punk', 'psych'],
};
function sleeveStyle(key) {
  const t = TUNES[key];
  const pool = (t && STYLE_BY_GENRE[t.genre]) || ['classical'];
  return pool[hashStr('sty' + key) % pool.length];
}

// A bug drawn straight onto the sleeve, sized to it.
function sleeveBug(ctx, key, cx, feetY, scale, opts = {}) {
  const spec = cached('slvbug|' + key, () => randomBugSpec(makeRng(hashStr('cover' + key))));
  drawBugAt(ctx, spec, cx, feetY, Object.assign({ pose: 'play', expr: 'focus', scale, bounce: 0, rate: 0 }, opts));
}

function sleeveCanvas(key, size) {
  const S = size || SLEEVE_PX;
  return cached('sleeve|' + key + '|' + S, () => {
    const c = makeCanvas(S, S), ctx = c.getContext('2d');
    const t = TUNES[key] || { title: key, composer: '', genre: 'folk' };
    const r = makeRng(hashStr('slv' + key));
    const style = sleeveStyle(key);
    const band = bandName(key);
    const title = t.title.toUpperCase();
    const fit = (str, w) => { let s2 = str; while (textWidth(s2, { font: 'small' }) > w && s2.length > 3) s2 = s2.slice(0, -1); return s2; };
    // A long title gets two lines rather than being chopped mid-word, because
    // half a title on a sleeve just looks like a mistake.
    const wrap2 = (str, w) => {
      if (textWidth(str, { font: 'small' }) <= w) return [str];
      const words = str.split(' '); let a = '', b = '';
      for (const wd of words) {
        if (!a || textWidth(a + ' ' + wd, { font: 'small' }) <= w) a = a ? a + ' ' + wd : wd;
        else b = b ? b + ' ' + wd : wd;
      }
      return b ? [a, fit(b, w)] : [fit(a, w)];
    };
    // Draw a title where the last line sits on `y`, so it never runs off the
    // bottom edge of the sleeve however long it is.
    const title2 = (str, cx2, y, w, col, o = {}) => {
      const ls = wrap2(str, w), lh = 7;
      ls.forEach((l, i) => drawText(ctx, l, cx2, y - (ls.length - 1 - i) * lh, col, Object.assign({ align: 'center', font: 'small' }, o)));
      return ls.length;
    };

    switch (style) {
      // ---- hard bop: two flat colours, a tilted photo block, condensed type
      case 'bop': {
        const bg = r.pick(['#1d4f7a', '#7a3320', '#2c6a52', '#6a2a4a']);
        rect(ctx, 0, 0, S, S, bg);
        halftone(ctx, 0, 0, S, S, '#ffffff', 5, 0.1);
        // the photo, knocked back to two tones and set at an angle
        ctx.save(); ctx.translate(S * 0.56, S * 0.52); ctx.rotate(-0.06); ctx.translate(-S * 0.56, -S * 0.52);
        rect(ctx, S * 0.3, S * 0.2, S * 0.62, S * 0.6, '#e8e0cc');
        rect(ctx, S * 0.3, S * 0.2, S * 0.62, 2, '#fff8ea');
        ctx.save(); ctx.beginPath(); ctx.rect(S * 0.3, S * 0.2, S * 0.62, S * 0.6); ctx.clip();
        sleeveBug(ctx, key, S * 0.61, S * 0.79, S / 62, { expr: 'cool' });
        ctx.globalAlpha = 0.35; rect(ctx, S * 0.3, S * 0.2, S * 0.62, S * 0.6, bg); ctx.globalAlpha = 1;
        ctx.restore(); ctx.restore();
        rect(ctx, 0, S - 16, S, 4, '#e8b23a');
        drawText(ctx, fit(band, S - 10), 5, 6, '#f4ecd6', { font: 'small' });
        wrap2(title, S - 10).forEach((l, i) => drawText(ctx, l, 5, 13 + i * 7, '#e8b23a', { font: 'small' }));
        drawText(ctx, LABELS[hashStr(key) % LABELS.length], 5, S - 10, '#f4ecd6', { font: 'small' });
        break;
      }
      // ---- prog gatefold: an airbrushed sky, a lone shape, an arched title
      case 'prog': {
        for (let y = 0; y < S; y++) rect(ctx, 0, y, S, 1, mixColor('#f0a860', '#2a2060', y / S));
        const sun = S * 0.34;
        ellipsePx(ctx, S / 2, sun, S * 0.22, S * 0.22, '#ffd98a');
        ellipsePx(ctx, S / 2, sun, S * 0.18, S * 0.18, '#ffefc0');
        // a ridge of rock, and a very small bug looking at it
        ctx.fillStyle = '#3a2a4a'; ctx.beginPath(); ctx.moveTo(0, S * 0.78);
        for (let x = 0; x <= S; x += 6) ctx.lineTo(x, S * 0.78 - Math.sin(x * 0.11 + 1) * 8 - (x > S * 0.5 ? 6 : 0));
        ctx.lineTo(S, S); ctx.lineTo(0, S); ctx.fill();
        sleeveBug(ctx, key, S * 0.3, S * 0.8, S / 110, { pose: 'idle' });
        for (let i = 0; i < 30; i++) px(ctx, r.int(0, S - 1), r.int(0, S * 0.5), '#fff8e0');
        drawText(ctx, fit(band, S - 8), S / 2, 6, '#f6e6c0', { align: 'center', font: 'small', outline: '#2a2060' });
        title2(title, S / 2, S - 12, S - 8, '#f6e6c0', { outline: '#2a2060' });
        break;
      }
      // ---- punk zine: a photocopy, a ransom-note title, a stapled corner
      case 'punk': {
        rect(ctx, 0, 0, S, S, '#e8e6de');
        for (let i = 0; i < 400; i++) px(ctx, r.int(0, S - 1), r.int(0, S - 1), r.chance(0.5) ? '#d2d0c8' : '#f4f2ea');
        ctx.save(); ctx.beginPath(); ctx.rect(4, 16, S - 8, S - 38); ctx.clip();
        rect(ctx, 4, 16, S - 8, S - 38, '#f8f6ee');
        sleeveBug(ctx, key, S / 2, S - 24, S / 58, { expr: 'angry', pose: 'cheer' });
        // blown-out photocopy: knock it to black and white with a halftone
        ctx.globalCompositeOperation = 'saturation'; rect(ctx, 4, 16, S - 8, S - 38, '#808080');
        ctx.globalCompositeOperation = 'source-over';
        halftone(ctx, 4, 16, S - 8, S - 38, '#000000', 3, 0.3);
        ctx.restore();
        frame(ctx, 4, 16, S - 8, S - 38, '#151515');
        // ransom note: every letter on its own scrap
        let lx = 4;
        for (const ch of fit(title, S - 8)) {
          const cw = textWidth(ch, { font: 'small' }) + 3, ch2 = r.int(-1, 1);
          rect(ctx, lx, 3 + ch2, cw, 9, r.chance(0.5) ? '#151515' : '#e8442e');
          drawText(ctx, ch, lx + 1, 5 + ch2, r.chance(0.5) ? '#f8f6ee' : '#ffe14d', { font: 'small' });
          lx += cw;
          if (lx > S - 8) break;
        }
        drawText(ctx, fit(band, S - 8), 5, S - 9, '#151515', { font: 'small' });
        for (const [sx, sy] of [[S - 10, 5], [S - 10, S - 9]]) { rect(ctx, sx, sy, 5, 2, '#9aa0a8'); rect(ctx, sx, sy + 2, 5, 1, '#6a7078'); }
        break;
      }
      // ---- eighties metal: chrome type, lightning, a guitar held overhead
      case 'shred': {
        for (let y = 0; y < S; y++) rect(ctx, 0, y, S, 1, mixColor('#1a1030', '#5a1040', y / S));
        for (let i = 0; i < 4; i++) {
          let x = r.int(8, S - 8), y = 0;
          while (y < S * 0.7) { const nx = x + r.int(-5, 5), ny = y + r.int(5, 11); line(ctx, x, y, nx, ny, '#9ad8ff'); line(ctx, x + 1, y, nx + 1, ny, '#e8f6ff'); x = nx; y = ny; }
        }
        sleeveBug(ctx, key, S / 2, S - 16, S / 56, { pose: 'cheer', expr: 'happy' });
        ctx.globalAlpha = 0.25; rect(ctx, 0, 0, S, S, '#ff40a0'); ctx.globalAlpha = 1;
        drawText(ctx, fit(band, S - 6), S / 2, 8, '#e8ecf4', { align: 'center', font: 'small', outline: '#7a1060', shadow: '#3a0830' });
        rect(ctx, 0, S - 21, S, 17, 'rgba(10,6,20,0.84)');
        title2(title, S / 2, S - 12, S - 6, '#ffd24a');
        break;
      }
      // ---- black metal: a wall of trees, an unreadable logo, one pale figure
      case 'bm': {
        rect(ctx, 0, 0, S, S, '#0a0b0c');
        for (let i = 0; i < 34; i++) {
          const x = r.int(0, S - 1), h = r.int(S * 0.4, S * 0.9), w = r.int(1, 3);
          rect(ctx, x, S - h, w, h, r.chance(0.4) ? '#1a1e1c' : '#121514');
          for (let b = 0; b < 4; b++) line(ctx, x, S - h + b * 8 + 6, x + r.int(-7, 7), S - h + b * 8, '#161a18');
        }
        rect(ctx, 0, S - 8, S, 8, '#0e1010');
        ctx.globalAlpha = 0.5; sleeveBug(ctx, key, S * 0.5, S - 10, S / 78, { pose: 'sad', expr: 'sad' }); ctx.globalAlpha = 1;
        ctx.globalAlpha = 0.6; rect(ctx, 0, 0, S, S, '#0a1418'); ctx.globalAlpha = 1;
        // the logo: spidery, symmetrical, barely legible, exactly as intended
        const ly = 12;
        drawText(ctx, fit(band, S - 10), S / 2, ly, '#cfd8d4', { align: 'center', font: 'small' });
        const bw = textWidth(fit(band, S - 10), { font: 'small' });
        for (const d of [-1, 1]) {
          const ex = S / 2 + d * (bw / 2 + 2);
          for (let i = 0; i < 5; i++) { line(ctx, ex, ly + 2, ex + d * (3 + i * 2), ly - 4 - i * 2, '#cfd8d4'); }
          line(ctx, ex, ly + 2, ex + d * 8, ly + 8, '#cfd8d4');
        }
        title2(title, S / 2, S - 7, S - 6, '#7a8a84');
        break;
      }
      // ---- folk: a warm washed photo of somebody sitting on a step
      case 'folk': {
        for (let y = 0; y < S; y++) rect(ctx, 0, y, S, 1, mixColor('#d8b478', '#8a6a44', y / S));
        rect(ctx, 0, S * 0.66, S, S * 0.34, '#7a5c3c');
        for (let i = 0; i < 3; i++) rect(ctx, 0, S * 0.66 + i * 8, S, 2, '#6a4e32');
        sleeveBug(ctx, key, S * 0.5, S * 0.78, S / 58, { pose: 'idle', expr: 'calm' });
        ctx.globalAlpha = 0.18; rect(ctx, 0, 0, S, S, '#e8c078'); ctx.globalAlpha = 1;
        for (let i = 0; i < 80; i++) px(ctx, r.int(0, S - 1), r.int(0, S - 1), r.chance(0.5) ? '#f0dcb8' : '#6a5238');
        rect(ctx, 0, 0, S, 1, '#f4e4c0'); frame(ctx, 0, 0, S, S, '#6a5238');
        // handwritten-looking title, on a slant
        rect(ctx, 2, S - 26, S - 4, 24, 'rgba(240,228,196,0.86)');
        ctx.save(); ctx.translate(6, S - 22); ctx.rotate(-0.04);
        wrap2(title, S - 14).forEach((l, i) => drawText(ctx, l, 0, i * 7, '#3a2a1a', { font: 'small' }));
        drawText(ctx, fit(band, S - 14), 0, 15, '#7a5e40', { font: 'small' });
        ctx.restore();
        break;
      }
      // ---- disco: a mirrorball sunburst and a lot of gloss
      case 'disco': {
        rect(ctx, 0, 0, S, S, '#2a1040');
        for (let i = 0; i < 24; i++) {
          const a = (i / 24) * Math.PI * 2;
          ctx.fillStyle = i % 2 ? '#e8409a' : '#f0a020'; ctx.globalAlpha = 0.5;
          ctx.beginPath(); ctx.moveTo(S / 2, S / 2);
          ctx.lineTo(S / 2 + Math.cos(a) * S, S / 2 + Math.sin(a) * S);
          ctx.lineTo(S / 2 + Math.cos(a + 0.13) * S, S / 2 + Math.sin(a + 0.13) * S); ctx.fill();
          ctx.globalAlpha = 1;
        }
        ellipsePx(ctx, S / 2, S * 0.42, S * 0.24, S * 0.24, '#b8c8e0');
        for (let y = -12; y <= 12; y += 3) for (let x = -12; x <= 12; x += 3) {
          if (x * x + y * y > 132) continue;
          px(ctx, S / 2 + x, S * 0.42 + y, (x + y) % 6 === 0 ? '#ffffff' : (x * y) % 4 === 0 ? '#8aa0c0' : '#dfe8f4');
        }
        sleeveBug(ctx, key, S / 2, S - 14, S / 66, { pose: 'cheer', expr: 'happy' });
        drawText(ctx, fit(band, S - 6), S / 2, S - 12, '#ffe14d', { align: 'center', font: 'small', outline: '#7a1050' });
        wrap2(title, S - 6).forEach((l, i) => drawText(ctx, l, S / 2, 5 + i * 7, '#ffffff', { align: 'center', font: 'small', outline: '#7a1050' }));
        break;
      }
      // ---- psychedelic poster: melting rings and type you have to work at
      case 'psych': {
        const c1 = r.pick(['#e84a2a', '#f0a020', '#5a30c0']), c2 = r.pick(['#20b0a0', '#e8e040', '#e8409a']);
        rect(ctx, 0, 0, S, S, c1);
        for (let rr = S; rr > 0; rr -= 7) { ellipsePx(ctx, S / 2 + Math.sin(rr * 0.3) * 4, S / 2, rr / 2, rr / 2.2, (rr / 7) % 2 ? c2 : c1); }
        ctx.globalAlpha = 0.9; sleeveBug(ctx, key, S / 2, S * 0.76, S / 62, { pose: 'play', expr: 'happy' }); ctx.globalAlpha = 1;
        for (let i = 0; i < 5; i++) { const y = S * 0.06 + i; rect(ctx, 0, y, S, 1, i % 2 ? c2 : c1); }
        drawText(ctx, fit(band, S - 6), S / 2, 6, '#2a1030', { align: 'center', font: 'small', outline: '#f6e8a0' });
        title2(title, S / 2, S - 10, S - 6, '#2a1030', { outline: '#f6e8a0' });
        break;
      }
      // ---- soul: a portrait in a soft vignette over one hot colour
      case 'soul': {
        const bg = r.pick(['#c8402a', '#2a5aa8', '#d88a20', '#7a2a6a']);
        rect(ctx, 0, 0, S, S, bg);
        ellipsePx(ctx, S / 2, S * 0.46, S * 0.36, S * 0.36, darken(bg, 0.25));
        ellipsePx(ctx, S / 2, S * 0.46, S * 0.33, S * 0.33, '#f0dfc0');
        ctx.save(); ctx.beginPath(); ctx.arc(S / 2, S * 0.46, S * 0.33, 0, Math.PI * 2); ctx.clip();
        sleeveBug(ctx, key, S / 2, S * 0.72, S / 48, { expr: 'calm', pose: 'idle' });
        ctx.restore();
        rect(ctx, 0, S - 26, S, 26, 'rgba(20,10,14,0.76)');
        drawText(ctx, fit(band, S - 6), S / 2, S - 24, '#ffe9b0', { align: 'center', font: 'small' });
        title2(title, S / 2, S - 9, S - 6, '#f0c060');
        break;
      }
      // ---- the plain classical box: a field, a rule, a catalogue number
      default: {
        const bg = r.pick(['#1f3a5c', '#3c2a1e', '#2a3c2a', '#4a2030']);
        rect(ctx, 0, 0, S, S, bg);
        frame(ctx, 4, 4, S - 8, S - 8, '#d8c48a');
        frame(ctx, 6, 6, S - 12, S - 12, '#8a7648');
        rect(ctx, 8, 8, S - 16, 12, '#d8c48a');
        drawText(ctx, fit(t.composer.toUpperCase(), S - 22), S / 2, 11, '#2a2018', { align: 'center', font: 'small' });
        ctx.save(); ctx.beginPath(); ctx.rect(10, 24, S - 20, S - 48); ctx.clip();
        rect(ctx, 10, 24, S - 20, S - 48, darken(bg, 0.16));
        sleeveBug(ctx, key, S / 2, S - 26, S / 56, { pose: 'play', expr: 'focus' });
        ctx.restore();
        frame(ctx, 10, 24, S - 20, S - 48, '#8a7648');
        title2(title, S / 2, S - 20, S - 16, '#e8dcb8');
        drawText(ctx, 'No. ' + (hashStr(key) % 900 + 100), S / 2, S - 12, '#9a8a60', { align: 'center', font: 'small' });
        break;
      }
    }
    // every sleeve is a printed object: a little wear, and a spine shadow
    ctx.globalAlpha = 0.14; rect(ctx, 0, 0, 3, S, '#000000'); ctx.globalAlpha = 1;
    for (let i = 0; i < 12; i++) { const x = r.int(0, S - 1), y = r.int(0, S - 1); ctx.globalAlpha = 0.2; px(ctx, x, y, r.chance(0.5) ? '#ffffff' : '#000000'); ctx.globalAlpha = 1; }
    frame(ctx, 0, 0, S, S, '#15121a');
    return c;
  });
}
// A sleeve sitting in its outer, as it looks in a crate.
function drawSleeve(ctx, key, x, y, size, opts = {}) {
  const S = Math.round(size);
  ctx.fillStyle = 'rgba(8,6,12,0.45)'; ctx.fillRect(x + 3, y + 4, S, S);
  ctx.drawImage(sleeveCanvas(key, SLEEVE_PX), 0, 0, SLEEVE_PX, SLEEVE_PX, Math.round(x), Math.round(y), S, S);
  if (opts.selected) { frame(ctx, x - 2, y - 2, S + 4, S + 4, '#fff8e8'); frame(ctx, x - 3, y - 3, S + 6, S + 6, '#d9a520'); }
  if (opts.done) { ctx.globalAlpha = 0.55; rect(ctx, x, y, S, S, '#0a0812'); ctx.globalAlpha = 1; ctx.drawImage(icon('check'), x + S / 2 - 6, y + S / 2 - 5); }
}

// ---------- Gear tiers: the ladder you climb ----------
// A busted instrument is genuinely easier to play and genuinely pays worse.
// Upgrading gives back lanes and money at the same time.
const GEAR_TIERS = [
  null,
  { name: 'BUSTED',    short: 'BUSTED',  pay: 0.55, window: 1.35, laneCut: 2, color: '#8a7a6a', desc: 'Held together with tape. Forgiving, and nobody tips for it.' },
  { name: 'PAWN SHOP', short: 'PAWN',    pay: 0.8,  window: 1.15, laneCut: 1, color: '#9a8a58', desc: 'Second hand and out of tune, but it holds a note.' },
  { name: 'WORKING',   short: 'WORKING', pay: 1.0,  window: 1.0,  laneCut: 0, color: '#5d8c56', desc: 'What a working musician actually plays.' },
  { name: 'PRO',       short: 'PRO',     pay: 1.3,  window: 0.95, laneCut: 0, color: '#3f7fa8', desc: 'Road-ready. Crowds hear the difference.' },
  { name: 'SIGNATURE', short: 'SIGNATURE', pay: 1.7, window: 0.9, laneCut: 0, color: '#8a3a9a', desc: 'Somebody famous had their name put on it.' },
];
function gearTier(q) { return GEAR_TIERS[clamp(Math.round(q || 1), 1, 5)]; }
// The instrument you actually play, once the state of your gear is applied.
function gearInstrument(kind, quality) {
  const base = INSTRUMENTS[kind]; if (!base) return INSTRUMENTS.guitar;
  const t = gearTier(quality);
  // Drums do not lose lanes, they lose *pieces*: the ladder says exactly what
  // you are sitting behind, from a bucket and a pot up to a full five-piece.
  if (kind === 'drums') {
    const q = clamp(Math.round(quality || 1), 1, 5);
    return cached('kit|' + q, () => {
      const rung = KIT_LADDER[q], pieces = rung.pieces;
      const allKeys = ['KeyD', 'KeyF', 'Space', 'KeyJ', 'KeyK'];
      const allNames = ['D', 'F', 'SP', 'J', 'K'];
      // fewer pieces use the middle keys, so your hands never start spread wide
      const pick = []; const n = pieces.length;
      for (let i = 0; i < n; i++) pick.push(Math.round((5 - n) / 2) + i);
      return Object.assign({}, base, {
        lanes: n, pieces, kitName: rung.name, junk: !!rung.junk, chrome: !!rung.chrome,
        keys: pick.map(i => allKeys[i]),
        keyNames: pick.map(i => allNames[i]),
        padNames: pieces.map(p => PIECE_LABEL[p]),
        drumFor: pieces.slice(),
      });
    });
  }
  if (!t.laneCut || !base.lanes || base.lanes <= 2) return base;
  return cached('gear|' + kind + '|' + quality, () => {
    const lanes = Math.max(2, base.lanes - t.laneCut);
    // keep the outer lanes so the shape of the instrument still reads
    const pick = [];
    for (let i = 0; i < lanes; i++) pick.push(Math.round(i * (base.lanes - 1) / (lanes - 1)));
    return Object.assign({}, base, {
      lanes,
      keys: pick.map(i => base.keys[i]),
      keyNames: pick.map(i => base.keyNames[i]),
      padNames: base.padNames ? pick.map(i => base.padNames[i]) : null,
      drumFor: base.drumFor ? pick.map(i => base.drumFor[i]) : null,
    });
  });
}

// ---- Build a song object from a tune
function songFromTune(key, opts = {}) {
  const t = TUNES[key]; const bpm = opts.bpm || t.bpm; const beat = 60 / bpm;
  const totalBeats = t.notes.reduce((a, n) => a + n[1], 0); const bars = Math.max(4, Math.ceil(totalBeats / 4));
  return { name: t.title, composer: t.composer, tune: key, genre: t.genre, bpm, beat, bars, root: t.key, chords: expandChords(t.chords, bars), melody: t.notes,
    leadIn: 4 * beat, length: 4 * beat + bars * 4 * beat + 1.6, style: GENRES[t.genre] ? GENRES[t.genre].backing : 'rock' };
}
function expandChords(chords, bars) { const out = []; for (let b = 0; b < bars; b++) out.push(chords[b % chords.length]); return out; }

  const beat = 60 / mv.bpm; const totalBeats = mv.notes.reduce((a, n) => a + n[1], 0);

// ===== js/sim/ear.js =====
// ---------- Call and response: hear it, then play it back ----------
// This is how anybody actually learns a tune. The band plays you a phrase and
// you watch where it lands on the instrument; then it goes quiet and you play
// the same phrase back from memory. Get the pitches right and get them in
// time. The hints thin out as the run goes on until you are working by ear.
'use strict';

const EAR_JUDGE = { perfect: 0.07, great: 0.13, good: 0.2 };
// How much help you get, by difficulty. Early on the keys are outlined for
// you; later you are only told the first note; at the top, nothing.
function earHints(difficulty) {
  // One listen, always: hearing the same bar twice is dead air. What changes
  // with difficulty is how much the instrument tells you afterwards.
  if (difficulty <= 1) return { ghosts: 'all', callRepeats: 1 };
  if (difficulty <= 2) return { ghosts: 'all', callRepeats: 1 };
  if (difficulty <= 4) return { ghosts: 'first', callRepeats: 1 };
  return { ghosts: 'none', callRepeats: 1 };
}

class EarGame {
  // song: {beat, bars, tune:{notes}}; surface: PianoSurface|FretSurface
  constructor(song, surface, mods = {}, hooks = {}) {
    this.song = song; this.surface = surface; this.mods = mods; this.hooks = hooks;
    this.difficulty = mods.difficulty || 1;
    this.hint = earHints(this.difficulty);
    this.beat = song.beat;
    this.barsPerPhrase = this.difficulty >= 5 ? 4 : 2;
    this.phrases = this.buildPhrases();
    // In a three-song set each number is a few phrases: the show has to move.
    if (mods.maxPhrases) this.phrases = this.phrases.slice(0, mods.maxPhrases);
    this.pi = 0; this.phase = 'lead'; this.phaseT = 0; this.repeat = 0;
    this.now = -song.leadIn; this.startTime = null; this.finished = false;
    this.counts = { perfect: 0, great: 0, good: 0, miss: 0 };
    this.combo = 0; this.maxCombo = 0; this.hype = 25; this.lastMilestone = 0;
    this.events = { perfects: 0, misses: 0, cheer: 0 };
    this.popups = []; this.bursts = []; this.fx = new Particles();
    this.lit = {}; this.held = {}; this.receptors = {}; this.flashes = {};
    this.beatPulse = 0; this.lastBeat = -1; this.onBeat = false;
    this.safetyLeft = mods.safetyNet || 0;
    this.notesTotal = this.phrases.reduce((n, p) => n + p.notes.length, 0);
    this.hypeScale = clamp(190 / Math.max(1, this.notesTotal), 1, 3);
    this.wrongT = 0; this.lastWrong = null;
  }
  // Chop the tune into singable phrases, dropping rests off the ends so each
  // one starts on a note the way a phrase you would hum does.
  buildPhrases() {
    const src = this.song.melody || [];
    const span = this.beat * 4 * this.barsPerPhrase;
    const out = []; let t = 0, cur = { notes: [], start: 0, end: span };
    for (const [midi, beats] of src) {
      const dur = beats * this.beat;
      if (t >= cur.end) { if (cur.notes.length) out.push(cur); cur = { notes: [], start: Math.floor(t / span) * span, end: (Math.floor(t / span) + 1) * span }; }
      if (midi > 0) cur.notes.push({ midi, t: t - cur.start, dur: Math.min(dur, this.beat * 1.5) });
      t += dur;

    if (cur.notes.length) out.push(cur);
    // A phrase of one note is not a phrase; fold it into its neighbour.

  // one. The song's own clock is no use here because every phrase runs twice.
  get progress() {

  get totalLength() {

  }
  get phraseLen() { return this.phrase.len || this.beat * 4 * this.barsPerPhrase; }

  get prompt() {

    if (this.phase === 'call') return { text: 'LISTEN', color: '#6fb8ff' };
    if (this.phase === 'response') return { text: 'YOUR TURN', color: '#ffd24a' };
    return { text: '', color: '#fff' };
  }
  // ---- what the gig scene expects of any play mode
  get instrument() { return this.instr || INSTRUMENTS.piano; }

  static get KEYMAP() {

  baseNote() {

  keyDown(code) {

  keyUp(code) { const off = EarGame.KEYMAP[code]; if (off != null) this.release(this.baseNote() + off); }

  win(k) { return EAR_JUDGE[k] * (this.mods.windowMult || 1); }
  judgeDt(dt) { const a = Math.abs(dt); if (a <= this.win('perfect')) return 'perfect'; if (a <= this.win('great')) return 'great'; if (a <= this.win('good')) return this.mods.tuner ? 'great' : 'good'; return 'miss'; }

  // ---- what should be lit right now, and what the player is allowed a hint on
  ghostsNow() {
    if (this.phase !== 'response') return {};
    const g = {}; const ns = this.expect || [];
    if (this.hint.ghosts === 'all') { for (const n of ns) if (!n.judged) g[n.midi] = 1; }
    else if (this.hint.ghosts === 'first') { const n = ns.find(x => !x.judged); if (n) g[n.midi] = 1; }

  }

  update(dt) {
    if (this.startTime != null) this.now = Audio.now() - this.startTime;
    // `events` is what happened THIS frame, not a running total: the crowd
    // reads it every tick to decide whether to cheer, tip or walk off.
    this.events = { perfects: 0, misses: 0, cheer: 0 };
    this.phaseT += dt;
    const beatPos = ((this.now % this.beat) + this.beat) % this.beat;
    this.beatPulse = 1 - beatPos / this.beat;

    for (const b of this.bursts) b.t += dt * 1.4; this.bursts = this.bursts.filter(b => b.t < 1);

        // count the band in, then start the first call
        if (this.now >= 0) { this.startCall(); }
        break;
      case 'call': {
        // play the phrase at the player, lighting each note as it sounds
        const p = this.phrase;
        for (const n of p.notes) {

          if (this.phaseT >= n.t) {

        if (this.phaseT >= this.phraseLen) {

      case 'response': {

        for (const n of this.expect) {

          if (this.phaseT > n.t + this.win('good') + 0.02) { n.judged = true; this.applyJudge('miss', n); }

  }
  startCall() {
    const p = this.phrase; for (const n of p.notes) n.played = false;
    this.phase = 'call'; this.phaseT = 0; this.repeat = 0;
    if (this.hooks.onPhase) this.hooks.onPhase('call', this.pi, this.phrases.length);
  }
  startResponse() {
    this.phase = 'response'; this.phaseT = 0;
    this.expect = this.phrase.notes.map(n => ({ midi: n.midi, t: n.t, dur: n.dur, judged: false }));

  }
  endPhrase() {

    if (this.pi >= this.phrases.length) { this.finished = true; this.phase = 'done'; return; }
    this.startCall();
  }
  // ---- the player played a pitch
  press(midi, spot) {
    if (this.finished) return null;
    this.held[midi] = true;
    if (this.phase !== 'response') {
      // noodling between phrases still makes a sound, it just does not score

    // game says which so you can hear what you did.

  }
  release(midi) { delete this.held[midi]; }

  // Two judgements in the same instant would print on top of each other and
  // read as neither, so a new popup steps up off any that are still on screen.
  pushPopup(p) {
    let y = p.y;
    for (let guard = 0; guard < 6; guard++) {

  results() {

  }
}

    case 'valves': add(0.14, 0.24, 'KeyJ', '1', '#f0c040'); add(0.38, 0.24, 'KeyK', '2', '#f0c040'); add(0.62, 0.24, 'KeyL', '3', '#f0c040'); break;

class DraftScene {
  constructor(gig) {
    const r = Game.run; this.t = 0; this.gig = gig; this.sel = 0; this.taken = false;
    const picks = []; for (let i = 0; i < 3; i++) { const k = r.randomCharm(picks); if (k) picks.push(k); }
    this.picks = picks; this.cards = [];
  }
  choose(i) {
    const r = Game.run; if (this.taken) return;
    if (i < this.picks.length) {
      const k = this.picks[i];
      if (r.charms.length >= r.charmSlots) { this.full = k; this.sel = i; Audio.ui('error'); return; }
      r.addCharm(k); Audio.ui('fanfare');
    } else { r.money += 15; Audio.ui('cash'); }
    this.taken = true; r.save(); setTimeout(() => Game.go(() => new CityScene(), 'iris'), 260);
  }
  swap(slot) { const r = Game.run; r.removeCharm(r.charms[slot]); r.addCharm(this.full); this.full = null; this.taken = true; Audio.ui('fanfare'); r.save(); setTimeout(() => Game.go(() => new CityScene(), 'iris'), 260); }

  key(code) {
    if (this.full != null) { const r = Game.run; if (code === 'ArrowLeft') this.sel = (this.sel + r.charms.length - 1) % r.charms.length; else if (code === 'ArrowRight') this.sel = (this.sel + 1) % r.charms.length; else if (['Enter', 'Space'].includes(code)) this.swap(this.sel); else if (code === 'Escape') this.full = null; return; }
    if (code === 'ArrowLeft' || code === 'KeyA') this.sel = (this.sel + this.cards.length - 1) % this.cards.length;
    else if (code === 'ArrowRight' || code === 'KeyD') this.sel = (this.sel + 1) % this.cards.length;
    else if (['Enter', 'Space'].includes(code)) this.choose(this.sel);
  }
  click(x, y) {
    if (this.full != null) { const r = Game.run; for (let i = 0; i < r.charms.length; i++) { const cx = W / 2 - r.charmSlots * 26 + i * 52; if (x >= cx && x < cx + 46 && y >= 392 && y < 438) { this.swap(i); return; } } return; }
    this.cards.forEach((c, i) => { if (x >= c.x && x < c.x + c.w && y >= c.y && y < c.y + c.h) { if (this.sel === i) this.choose(i); else { this.sel = i; Audio.ui('move'); } } });
  }
  hover(x, y) { this.cards.forEach((c, i) => { if (x >= c.x && x < c.x + c.w && y >= c.y && y < c.y + c.h) this.sel = i; }); }
  draw(ctx) {
    const r = Game.run;

    this.cards = []; const n = this.picks.length + 1, cw = 176, gap = 22, x0 = Math.round((W - (n * cw + (n - 1) * gap)) / 2);
    for (let i = 0; i < n; i++) {

      const sel = i === this.sel, ch = 252;

      const x = x0 + i * (cw + gap), y = Math.round(90 - (sel ? 12 : 0) + bob);

      const rar = isCash ? 'cash' : c.rarity, rc = { common: '#4d86c6', uncommon: '#4f8032', rare: '#c8433a', cash: '#2a7a3a' }[rar];
      // rarity glow behind the card, strongest on rares

    for (let i = 0; i < r.charmSlots; i++) { const cx = W / 2 - r.charmSlots * 26 + i * 52, k = r.charms[i]; uiItemSlot(ctx, cx, 392, 46, k ? charmArt(CHARMS[k].icon) : null, { empty: !k, selected: this.full != null && this.sel === i }); }

// ---------- Game core: loop, input, run state, save ----------
'use strict';
const SAVE_KEY = 'bugbusker_v2_save';
const CHARM_SLOTS_BASE = 5;

class Member {
  constructor(o) { Object.assign(this, { name: 'Bug', presetKey: null, spec: null, instrument: 'guitar', quality: 1, skill: 1, stamina: 100, hunger: 0, xp: 0, leader: false, gigs: 0 }, o); if (!this.spec) this.spec = randomBugSpec(makeRng(hashStr(this.name))); }
}
class RunState {
  constructor(seed) {
    this.seed = seed; this.rng = makeRng(seed);
    this.money = 6; this.day = 0; this.members = []; this.charms = []; this.charmSlots = CHARM_SLOTS_BASE; this.vouchers = []; this.perks = {}; this.consumables = []; this.spareInstruments = [];
    this.buffs = {}; this.karma = 0; this.pendingGig = null; this.stats = { earned: 0, gigs: 0, bestCombo: 0, perfects: 0, bestPayout: 0 };
    this.today = { earned: 0, gigs: 0, bestCombo: 0, perfects: 0, tiles: 0, recruited: 0, upgrades: 0 }; this.goals = [];
    this.pos = 'mission'; this.tickets = 7; this.stamina = 46; this.staminaMax = 46; this.tile = null; this.weather = 'clear'; this.doneNodes = {}; this.hero = 'buzz'; this.nightPending = false; this.seenEvents = []; this.log = [];
  }
  static newRun(char) {
    const s = new RunState((Date.now() ^ (Math.random() * 0xffffffff)) >>> 0);
    const c = char || ROSTER[0], p = HERO_PRESETS[c.key];
    s.hero = c.key;
    s.members.push(new Member({ name: p.name, presetKey: c.key, spec: p, instrument: c.instrument, quality: 1, skill: 2 + c.stats[0], leader: true }));   // quality 1 is BUSTED: easy to play, pays badly
    s.money = c.money; if (c.charm) s.addCharm(c.charm);
    s.stats.charSkill = c.stats;
    s.consumables.push('bread');
    s.pos = 'mission'; s.tickets = 7; s.stamina = s.staminaMax = 46; s.tile = null; s.weather = 'clear'; s.doneNodes = {};
    s.today = { earned: 0, gigs: 0, bestCombo: 0, perfects: 0, tiles: 0, recruited: 0, upgrades: 0 }; s.goals = rollGoals(s);
    return s;
  }
  newDay() {
    const bonus = collectMods(this).tickets || 0;
    this.staminaMax = 46 + bonus * 6; this.stamina = this.staminaMax;
    this.tickets = 7 + bonus; this.doneNodes = {};
    this.today = { earned: 0, gigs: 0, bestCombo: 0, perfects: 0, tiles: 0, recruited: 0, upgrades: 0 };
    this.goals = rollGoals(this);
    // the first days back are grey on purpose
    this.weather = this.day === 0 ? 'clear' : (this.day <= 1 && this.rng.chance(0.6)) ? this.rng.pick(['fog', 'rain', 'fog']) : this.rng.pick(WEATHER_KEYS);
  }
  rest(n) { this.stamina = clamp(this.stamina + n, 0, this.staminaMax); }
  hasCharm(k) { return this.charms.includes(k); }
  addCharm(k) { if (this.charms.includes(k) || this.charms.length >= this.charmSlots) return false; this.charms.push(k); return true; }
  removeCharm(k) { const i = this.charms.indexOf(k); if (i >= 0) this.charms.splice(i, 1); }
  randomCharm(exclude = []) {
    const pool = CHARM_KEYS.filter(k => !this.charms.includes(k) && !exclude.includes(k)); if (!pool.length) return null;
    const weights = pool.map(k => RARITY_WEIGHT[CHARMS[k].rarity] || 1); let tot = weights.reduce((a, b) => a + b, 0), r = this.rng() * tot;
    for (let i = 0; i < pool.length; i++) { r -= weights[i]; if (r <= 0) return pool[i]; } return pool[pool.length - 1];
  }
  makeMember(instrs) {
    const usedNames = this.members.map(m => m.name); const name = this.rng.pick(FIRST_NAMES.filter(n => !usedNames.includes(n)) || FIRST_NAMES);
    const spec = randomBugSpec(this.rng); spec.name = name; spec.species = ['Beetle', 'Weevil', 'Cricket', 'Moth', 'Hopper', 'Ant', 'Aphid'][this.rng.int(0, 6)];
    return new Member({ name, spec, instrument: this.rng.pick(instrs || PLAYABLE), quality: this.rng.int(1, 2), skill: this.rng.int(1, 3 + this.day), stamina: this.rng.int(60, 100) });
  }
  recruitRandom(instrs) { const m = this.makeMember(instrs); this.members.push(m); return m; }
  recruitPreset(key, instrument, skill) { const p = HERO_PRESETS[key]; const m = new Member({ name: p.name, presetKey: key, spec: p, instrument, quality: 2, skill: skill || 4 }); this.members.push(m); return m; }
  mealPrice() { return Math.max(3, 7 + this.day * 3 - (this.perks.mealDiscount || 0)); }
  avgSkill() { return this.members.reduce((a, m) => a + m.skill, 0) / Math.max(1, this.members.length); }
  gigMods(performers, difficulty, bossMod) {
    const avgSt = performers.reduce((a, m) => a + m.stamina, 0) / performers.length, hungerPen = performers.reduce((a, m) => a + m.hunger, 0) / performers.length;
    const m = collectMods(this, { difficulty, bossMod });
    m.windowMult *= (0.78 + 0.22 * (avgSt / 100)) * (1 - 0.08 * hungerPen);
    // your gear decides how forgiving the timing is and how well the set pays
    const lead = gearTier(this.members[0] ? this.members[0].quality : 1);
    m.windowMult *= lead.window;
    m.tipMult *= lead.pay;
    m.gearPay = performers.reduce((a, p2) => a + gearTier(p2.quality).pay, 0) / Math.max(1, performers.length);
    return m;
  }
  // The whole band's gear, averaged, as a number the tally can show.
  gearScore() { return this.members.reduce((a, m) => a + gearTier(m.quality).pay, 0) / Math.max(1, this.members.length); }
  save() {
    try {
