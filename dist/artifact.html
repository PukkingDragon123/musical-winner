// Standalone instrument props (drum kit, keyboard stand) drawn on the stage, not on the bug
function propInstrument(kind) {

// ---- Build a song object from a tune
function songFromTune(key, opts = {}) {
  const t = TUNES[key]; const bpm = opts.bpm || t.bpm; const beat = 60 / bpm;
  const totalBeats = t.notes.reduce((a, n) => a + n[1], 0); const bars = Math.max(4, Math.ceil(totalBeats / 4));
  return { name: t.title, composer: t.composer, tune: key, genre: t.genre, bpm, beat, bars, root: t.key, chords: expandChords(t.chords, bars), melody: t.notes,
    leadIn: 4 * beat, length: 4 * beat + bars * 4 * beat + 1.6, style: GENRES[t.genre] ? GENRES[t.genre].backing : 'rock' };
}
function expandChords(chords, bars) { const out = []; for (let b = 0; b < bars; b++) out.push(chords[b % chords.length]); return out; }
function songFromMovement(mv) {
  const beat = 60 / mv.bpm; const totalBeats = mv.notes.reduce((a, n) => a + n[1], 0);
  const bars = mv.impossible ? 8 : Math.max(4, Math.ceil(totalBeats / 4));
  return { name: mv.title, composer: 'BUZZ', genre: 'rock', bpm: mv.bpm, beat, bars, root: mv.key_, chords: expandChords(mv.chords, bars), melody: mv.notes,
    leadIn: 4 * beat, length: 4 * beat + bars * 4 * beat + 1.6, style: mv.style };
}
// ---- Chart from a melody. Lanes follow the melodic contour so the chart IS the tune.
function chartFromMelody(song, sections, difficulty, rng, opts = {}) {
  const notes = []; const beat = song.beat; const mel = song.melody;
  const pitches = mel.filter(n => n[0] > 0).map(n => n[0]);
  const lo = Math.min(...pitches), hi = Math.max(...pitches), span = Math.max(1, hi - lo);
  const starRate = opts.starRate != null ? opts.starRate : 0.08;
  const bombRate = difficulty >= 2 ? (0.015 + difficulty * 0.006) * (opts.bombMult || 1) : 0;
  for (const sec of sections) {
    const instr = INSTRUMENTS[sec.instrument]; const secStart = song.leadIn + sec.startBar * 4 * beat, secEnd = song.leadIn + sec.endBar * 4 * beat;
    if (sec.qte) { for (let bar = sec.startBar; bar < sec.endBar; bar++) { const barT = song.leadIn + bar * 4 * beat; const slots = difficulty >= 4 ? [0, 2] : [0]; for (const s of slots) if (rng.chance(0.9)) notes.push({ t: barT + s * beat, lane: 0, dur: 0, type: 'qte', midi: song.root + 12 }); } continue; }
    // walk the melody, looping it to fill the section
    let t = secStart, i = 0, lastLane = Math.floor((instr.lanes || 2) / 2), lastDir = 1, guard = 0;
    while (t < secEnd - 0.001 && guard++ < 900) {
      const [midi, beats] = mel[i % mel.length]; i++;
      const dur = beats * beat;
      if (midi === 0) { t += dur; continue; }
      const rel = (midi - lo) / span;              // 0..1 contour
      const isLong = beats >= 1.5, isFast = beats <= 0.3;
      const star = rng.chance(starRate) && !isFast;
      const bomb = !star && rng.chance(bombRate) && beats <= 0.5;
      switch (instr.game) {
        case 'lanes': {
          const L = instr.lanes; let lane = clamp(Math.round(rel * (L - 1)), 0, L - 1);
          if (L <= 2) lane = rel > 0.5 ? L - 1 : 0;
          if (lane === lastLane && rng.chance(0.25) && L > 2) lane = clamp(lane + rng.sign(), 0, L - 1);
          lastLane = lane;
          if (bomb) { notes.push({ t, lane: clamp(lane + rng.sign(), 0, L - 1), dur: 0, type: 'bomb', midi }); break; }
          if (isLong && difficulty >= 2) { notes.push({ t, lane, dur: dur - beat * 0.15, type: 'hold', midi, star }); break; }
          notes.push({ t, lane, dur: 0, type: 'tap', midi, star });
          if (L >= 6 && difficulty >= 3 && beats >= 1 && rng.chance(0.22)) { const l2 = clamp(lane + (lane < L - 2 ? 2 : -2), 0, L - 1); notes.push({ t, lane: l2, dur: 0, type: 'tap', midi: midi + 4, chord: true }); notes[notes.length - 2].chord = true; }
          break;
        }
        case 'taiko': {
          if (bomb) { notes.push({ t, lane: 0, dur: 0, type: 'bomb', midi }); break; }
          const strong = (t - secStart) % (beat * 2) < 0.001;
          let type = rel > 0.55 ? 'ka' : 'don'; if (strong && isLong && difficulty >= 3 && rng.chance(0.5)) type = 'big';
          if (isLong && beats >= 2 && rng.chance(0.5)) { notes.push({ t, lane: 0, dur: Math.min(dur, beat * 2), type: 'roll', midi }); break; }
          notes.push({ t, lane: 0, dur: 0, type, midi, star: star && type !== 'big' }); break;
        }
        case 'wind': { notes.push({ t, lane: 0, dur: Math.max(beat * 0.35, dur - beat * 0.12), type: 'hold', midi, pitch: rel, star }); break; }
        case 'valves': { if (bomb) { notes.push({ t, lane: 0, dur: 0, type: 'bomb', midi }); break; } const combo = 1 + (Math.round(rel * 6) % 7); notes.push({ t, lane: 0, dur: 0, type: 'tap', midi, combo, star }); break; }
        case 'bow': { let dir = -lastDir; if (rng.chance(0.15)) dir = lastDir; lastDir = dir; const hold = isLong && difficulty >= 2; notes.push({ t, lane: dir > 0 ? 1 : 0, dur: hold ? dur - beat * 0.15 : 0, type: hold ? 'hold' : 'tap', midi, dir, pitch: rel, star: star && !hold }); break; }
      }
      t += dur;
    }
  }
  notes.sort((a, b) => a.t - b.t); notes.forEach((n, i) => { n.id = i; n.hit = false; n.judged = false; });
  return notes;
}

// ---------- Backstage: the awkward room ----------
class BackstageScene {
  constructor() {
    this.t = 0; this.step = 0; this.fx = new Particles();
    this.beats = [
      { who: null, text: '' }, { who: 'monarch', text: '...' }, { who: 'you', text: 'I can fix it.' },
      { who: 'monarch', text: 'Pack your case.' }, { who: 'dot', text: 'Sorry, Buzz.' }, { who: null, text: 'THE DOOR' },
    ];
    this.you = Game.run.members[0];
  }
  advance() { this.step++; Audio.ui('select'); if (this.step >= this.beats.length) Game.setScene(new FlightScene()); }
  update(dt) { this.t += dt; this.fx.update(dt); }
  key(code) { if (['Enter', 'Space', 'KeyZ'].includes(code)) this.advance(); }
  click() { this.advance(); }
  draw(ctx) {
    // dressing room
    vgrad(ctx, 0, 0, W, H, '#2a2230', '#181320');
    for (let x = 0; x < W; x += 40) { rect(ctx, x, 0, 2, 250, '#221a28'); }
    rect(ctx, 0, 250, W, H - 250, '#3a2a24'); rect(ctx, 0, 250, W, 3, '#5a4238');
    for (let x = 0; x < W; x += 26) rect(ctx, x, 253, 1, H - 253, '#2e2018');
    // mirror with bulbs
    rect(ctx, 40, 60, 190, 130, '#1a1620'); frame(ctx, 40, 60, 190, 130, '#6a5a3a'); rect(ctx, 46, 66, 178, 118, '#3a3a4a');
    for (let i = 0; i < 9; i++) { const bx = 46 + i * 21, on = Math.floor(this.t * 2 + i) % 7 !== 0; circle(ctx, bx + 4, 54, 4, on ? '#ffe8a0' : '#5a5040'); if (on) { ctx.globalAlpha = 0.1; circle(ctx, bx + 4, 54, 14, '#ffe680'); ctx.globalAlpha = 1; } }
    // reflection of you
    ctx.globalAlpha = 0.5; drawBugAt(ctx, this.you.spec, 135, 178, { pose: 'idle', scale: 1.6 }); ctx.globalAlpha = 1;
    // door
    rect(ctx, 520, 80, 90, 172, '#4a3420'); frame(ctx, 520, 80, 90, 172, '#2a1a10'); rect(ctx, 528, 88, 74, 156, '#5a4028');
    circle(ctx, 596, 170, 4, '#d8b040');
    const exitGlow = this.step >= 5 ? 0.35 + 0.25 * Math.sin(this.t * 6) : 0.1;
    ctx.globalAlpha = exitGlow; rect(ctx, 520, 60, 90, 22, '#6be585'); ctx.globalAlpha = 1;
    drawText(ctx, 'EXIT', 565, 66, '#0e2a14', { align: 'center' });
    // couch + clutter
    rect(ctx, 250, 200, 150, 52, '#6a3a4a'); rect(ctx, 250, 196, 150, 8, '#8a4a5a'); rect(ctx, 256, 252, 10, 12, '#3a2018'); rect(ctx, 384, 252, 10, 12, '#3a2018');
    ctx.drawImage(propCanvas('suitcase'), 430, 238);
    // cast: you left, others clustered right, all facing away
    const you = { x: 150, y: 300 };
    drawShadow(ctx, you.x, you.y, 22); drawBugAt(ctx, this.you.spec, you.x, you.y, { pose: 'idle', instrument: this.you.instrument, scale: 1.5 });
    const crew = [{ k: 'monarch', x: 400 }, { k: 'dot', x: 460 }, { k: 'hopper', x: 510 }];
    crew.forEach((c, i) => { drawShadow(ctx, c.x, 300, 20); drawBugAt(ctx, HERO_PRESETS[c.k], c.x, 300, { pose: 'idle', flip: true, scale: 1.5, instrument: c.k === 'monarch' ? 'mic' : null }); });
    // awkward silence marks
    if (this.step <= 1) { for (let i = 0; i < 3; i++) { const a = 0.4 + 0.3 * Math.sin(this.t * 2 + i); ctx.globalAlpha = a; drawText(ctx, '.', 300 + i * 12, 150, '#8a86b0', { scale: 2 }); ctx.globalAlpha = 1; } }
    const b = this.beats[this.step];

// ---------- The flight: one last practice ----------

'use strict';
const SAVE_KEY = 'bugbusker_v2_save';
const CHARM_SLOTS_BASE = 5;

class Member {
  constructor(o) { Object.assign(this, { name: 'Bug', presetKey: null, spec: null, instrument: 'guitar', quality: 1, skill: 1, stamina: 100, hunger: 0, xp: 0, leader: false, gigs: 0 }, o); if (!this.spec) this.spec = randomBugSpec(makeRng(hashStr(this.name))); }
}
class RunState {
  constructor(seed) {

    this.pos = 'mission'; this.tickets = 7; this.weather = 'clear'; this.doneNodes = {}; this.hero = 'buzz'; this.nightPending = false; this.seenEvents = []; this.log = [];
  }
  static newRun(char) {
    const s = new RunState((Date.now() ^ (Math.random() * 0xffffffff)) >>> 0);

    s.members.push(new Member({ name: p.name, presetKey: c.key, spec: p, instrument: c.instrument, quality: 1, skill: 2 + c.stats[0], leader: true }));
    s.money = c.money; if (c.charm) s.addCharm(c.charm);

  }
  newDay() {
    const bonus = collectMods(this).tickets || 0;

  hasCharm(k) { return this.charms.includes(k); }

  randomCharm(exclude = []) {
    const pool = CHARM_KEYS.filter(k => !this.charms.includes(k) && !exclude.includes(k)); if (!pool.length) return null;
    const weights = pool.map(k => RARITY_WEIGHT[CHARMS[k].rarity] || 1); let tot = weights.reduce((a, b) => a + b, 0), r = this.rng() * tot;
    for (let i = 0; i < pool.length; i++) { r -= weights[i]; if (r <= 0) return pool[i]; } return pool[pool.length - 1];
  }
  makeMember(instrs) {
    const usedNames = this.members.map(m => m.name); const name = this.rng.pick(FIRST_NAMES.filter(n => !usedNames.includes(n)) || FIRST_NAMES);
    const spec = randomBugSpec(this.rng); spec.name = name; spec.species = ['Beetle', 'Weevil', 'Cricket', 'Moth', 'Hopper', 'Ant', 'Aphid'][this.rng.int(0, 6)];
    return new Member({ name, spec, instrument: this.rng.pick(instrs || PLAYABLE), quality: this.rng.int(1, 2), skill: this.rng.int(1, 3 + this.day), stamina: this.rng.int(60, 100) });
  }
  recruitRandom(instrs) { const m = this.makeMember(instrs); this.members.push(m); return m; }
  recruitPreset(key, instrument, skill) { const p = HERO_PRESETS[key]; const m = new Member({ name: p.name, presetKey: key, spec: p, instrument, quality: 2, skill: skill || 4 }); this.members.push(m); return m; }

    const avgSt = performers.reduce((a, m) => a + m.stamina, 0) / performers.length, hungerPen = performers.reduce((a, m) => a + m.hunger, 0) / performers.length;
    const m = collectMods(this, { difficulty, bossMod });

  }
  save() {
    try {
      const data = { seed: this.seed, money: this.money, day: this.day, members: this.members, charms: this.charms, charmSlots: this.charmSlots, vouchers: this.vouchers, perks: this.perks, consumables: this.consumables, spareInstruments: this.spareInstruments, karma: this.karma, stats: this.stats, buffs: this.buffs, pendingGig: this.pendingGig, seenEvents: this.seenEvents, nightPending: this.nightPending, pos: this.pos, tickets: this.tickets, weather: this.weather, doneNodes: this.doneNodes, hero: this.hero, lastTune: this.lastTune };

  }

    try {

  }

  static clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { } }
}

class Menu {

  move(d) { if (!this.items.length) return; this.idx = (this.idx + d + this.items.length) % this.items.length; this.fixIdx(d); Audio.ui('move'); }
  key(code) {
    if (code === 'ArrowUp' || code === 'KeyW') { this.move(-1); return true; } if (code === 'ArrowDown' || code === 'KeyS') { this.move(1); return true; }

      if (style === 'buttons') { uiButton(ctx, x, yy, w, rowH - 3, it.label, it.disabled ? 'disabled' : sel ? 'hover' : 'normal', it.color ? { color: it.color, hi: lighten(it.color, 0.2), lo: darken(it.color, 0.2), ol: darken(it.color, 0.45) } : {}); return; }
      if (sel) { rect(ctx, x, yy, w, rowH - 2, it.disabled ? 'rgba(90,58,30,0.15)' : UI.paperLo); frame(ctx, x, yy, w, rowH - 2, it.disabled ? UI.paperLine : UI.wood); }
